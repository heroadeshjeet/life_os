<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taskiee</title>
<style>
  /* Disable text selection across the entire page */
  body {
    -webkit-user-select: none; /* Safari */
    -ms-user-select: none;     /* IE 10 and Edge */
    user-select: none;         /* Standard syntax */
  }

  /* Prevent link dragging visual behavior */
  a, img {
    -webkit-user-drag: none;
    user-drag: none;
  }
</style>

<script>
  // 1. Disable Right-Click (Context Menu)
  document.addEventListener('contextmenu', (event) => {
    event.preventDefault();
  });

  // 2. Disable Link and Image Dragging
  document.addEventListener('dragstart', (event) => {
    if (event.target.tagName === 'A' || event.target.tagName === 'IMG') {
      event.preventDefault();
    }
  });

  // 3. Disable DevTools Shortcuts (F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U)
  document.addEventListener('keydown', (event) => {
    // Prevent F12
    if (event.key === 'F12') {
      event.preventDefault();
    }
    
    // Prevent Ctrl+Shift+I (Inspect element) and Ctrl+Shift+J (Console)
    if (event.ctrlKey && event.shiftKey && (event.key === 'I' || event.key === 'i' || event.key === 'J' || event.key === 'j')) {
      event.preventDefault();
    }

    // Prevent Ctrl+U (View Source)
    if (event.ctrlKey && (event.key === 'U' || event.key === 'u')) {
      event.preventDefault();
    }
  });
</script>
</main>
    <style>
body {
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;

        }
        :root {
            /* Light Theme Defaults */
            --bg-color: #f2f4f8;
            --surface-color: #ffffff;
            --primary-color: #6c5ce7;
            --text-main: #2d3436;

            body:not(.light-mode) {
                --bg-color: #121212;
                --surface-color: #1e1e1e;
                --primary-color: #a29bfe;
                --text-main: #dfe6e9;
                --text-sub: #b2bec3;
                --border: #2d3436;

            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none; /* No text selection */
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center; /* Center on desktop */
        }

        /* --- DESKTOP WRAPPER --- */
#app-container {
    width: 100%;
    max-width: var(--app-max-width);
    height: 100%;
    position: relative;
    background: var(--bg-color);
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 50px rgba(0,0,0,0.1);
    overflow: hidden; /* <--- ADD THIS LINE */
}

        /* --- SPLASH SCREEN --- */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .splash-text {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary-color);
            white-space: nowrap;
            overflow: hidden;
            border-right: 3px solid var(--primary-color);
            /* Fixed Typewriter Logic */
            width: 0; 
            max-width: 100%;
            animation: 
                typing 1.5s steps(10, end) forwards, /* Increased steps */
                blink 0.75s step-end infinite,
                blurFadeIn 1s ease-out forwards;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; } /* Let it grow to fit content */
        }
        @keyframes blink {
            from, to { border-color: transparent; }
            50% { border-color: var(--primary-color); }
        }
        @keyframes blurFadeIn {
            0% { filter: blur(10px); opacity: 0; }
            100% { filter: blur(0px); opacity: 1; }
        }

        /* --- HEADER & THEME TOGGLE --- */
        header {
            padding: 20px;
            padding-top: 40px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-color);
            flex-shrink: 0; /* Prevent shrinking */
        }

        h1 { font-size: 24px; font-weight: 700; }
         
        .theme-btn {
            background: var(--surface-color);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: var(--shadow);
        }

        /* --- PAGES --- */
        .page {
            flex-grow: 1; /* Key fix for layout collapsing */
            overflow-y: auto; /* Allow scrolling inside the page */
            padding: 0 20px 100px 20px; 
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s;
        }

        .page.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* --- TASKS --- */
        .task-card {
            background: var(--surface-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            animation: slideIn 0.3s ease;
            cursor: pointer; /* Better for desktop feel */
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .checkbox-wrapper {
            position: relative;
            width: 24px;
            height: 24px;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .checkbox-wrapper input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            z-index: 2;
        }

        .checkmark {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 2px solid var(--text-sub);
            border-radius: 6px;
            transition: all 0.2s;
        }

        .checkbox-wrapper input:checked ~ .checkmark {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        .task-content { flex: 1; pointer-events: none; /* Let clicks pass to card if needed */ }
         
        .task-title { font-weight: 600; font-size: 16px; }
        .task-desc { font-size: 13px; color: var(--text-sub); margin-top: 2px; }
        
        .task-reminder-tag {
            display: inline-flex;
            align-items: center;
            font-size: 11px;
            font-weight: 600;
            color: var(--primary-color);
            background: rgba(108, 92, 231, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 4px;
        }
        body.dark-mode .task-reminder-tag {
            background: rgba(162, 155, 254, 0.15);
        }

        .task-card.completed .task-title { text-decoration: line-through; opacity: 0.6; }
        .task-card.completed .task-desc { text-decoration: line-through; opacity: 0.5; }
        .task-card.completed .task-reminder-tag { opacity: 0.4; }

        .btn-action-container {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-delete {
            padding: 8px;
            color: var(--danger);
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }

        .btn-bell {
            padding: 8px;
            color: var(--text-sub);
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
        }
        .btn-bell.active {
            color: var(--warning);
            animation: ring 0.3s ease;
        }

        @keyframes ring {
            0% { transform: rotate(0); }
            25% { transform: rotate(15deg); }
            50% { transform: rotate(-15deg); }
            75% { transform: rotate(10deg); }
            100% { transform: rotate(0); }
        }

        /* --- FLOATING BUTTON --- */
        .fab {
            position: absolute;
            bottom: 90px;
            right: 25px;
            width: 56px; height: 56px;
            background: var(--primary-color);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 28px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            z-index: 100;
            cursor: pointer;
            user-select: none;
        }

        /* --- MODAL --- */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            opacity: 0;
            pointer-events: none; /* Crucial: clicks pass through when hidden */
            transition: opacity 0.3s;
            z-index: 200;
            backdrop-filter: blur(2px);
        }
        .overlay.active { opacity: 1; pointer-events: auto; }

/* --- MODAL --- */
body {
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;

        }
#modal.open, #notif-modal.open { 
    transform: translateY(0); 
    visibility: visible; /* <--- ADD THIS */
}

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--bg-color);
            color: var(--text-main);

        }

        button.btn-save {
            width: 100%;
            padding: 15px;

        }

        button.btn-clear-notif {
            width: 100%;
            padding: 12px;
            background: none;
            color: var(--danger);
            border: 1px solid var(--border);

            cursor: pointer;
        }

        /* --- BOTTOM NAV --- */
        .bottom-nav {
            height: 70px;

            display: flex;
            border-top: 1px solid var(--border);
            flex-shrink: 0; /* Don't shrink */
            z-index: 90;
        }

            flex: 1;
            display: flex;
            flex-direction: column;

        }
        .nav-item.active { color: var(--primary-color); }
        .nav-icon { font-size: 20px; margin-bottom: 4px; }

        /* --- CALENDAR --- */
        .calendar-grid {
            display: grid;

    </style>
</head>
<body>

    <div id="splash">
        <div style="display:inline-block">
            <div class="splash-text">Taskiee</div>
        </div>
    </div>

    <div id="app-container">
        <header>
            <div>
                <h1>Taskiee</h1>
                <div style="font-size:12px; color:var(--text-sub)" id="date-display">...</div>
            </div>
            <div class="theme-btn" id="theme-toggle">🌓</div>
        </header>

        <div id="page-today" class="page active">
            <div id="task-list" style="padding-top: 10px;">
                </div>
            <div id="empty-state" style="text-align:center; margin-top:50px; color:var(--text-sub); display:none">
                No tasks for today.<br>Tap + to start!
            </div>
        </div>

        <div id="page-history" class="page">
            <div style="background:var(--surface-color); padding:20px; border-radius:15px; margin-top:10px; text-align:center; border:1px solid var(--border);">
                <div style="font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--text-sub)">Current Streak</div>
                <div style="font-size:36px; font-weight:800; color:var(--primary-color)" id="streak-val">0</div>
                <div style="font-size:12px; color:var(--text-sub)">Days in a row</div>
            </div>
            <div class="calendar-grid" id="calendar"></div>
        </div>

        <div class="fab" onclick="openModal()">+</div>

        <div class="overlay" id="overlay" onclick="closeModal()"></div>
        <div id="modal">
            <h3 style="margin-bottom:15px">New Task</h3>
            <input type="text" id="inp-title" placeholder="What needs to be done?">
            <input type="text" id="inp-desc" placeholder="Details (Optional)">
            <button class="btn-save" onclick="saveTask()">ADD TASK</button>
        </div>

        <div class="overlay" id="notif-overlay" onclick="closeNotifModal()"></div>
        <div id="notif-modal">
            <h3 style="margin-bottom:8px">Set Reminder Alarms</h3>
            <p style="font-size: 13px; color: var(--text-sub); margin-bottom: 15px;">Pick a time to receive system notifications for this task.</p>
            <input type="time" id="inp-notif-time">
            <button class="btn-save" onclick="saveReminder()">SET ALARM REMINDER</button>
            <button class="btn-clear-notif" id="btn-clear-reminder" onclick="clearReminder()">Remove Current Reminder</button>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="nav('today', this)">
                <span class="nav-icon">📝</span>
                <span class="nav-text">Today</span>
            </div>
            <div class="nav-item" onclick="nav('history', this)">
                <span class="nav-icon">📅</span>
                <span class="nav-text">History</span>
            </div>
        </div>
    </div>

    <script>
        // --- DATA LAYER (LocalStorage) ---
        const DB_KEY = "taskiee_v2_db";
        const THEME_KEY = "taskiee_theme";
        
        let store = {
            tasks: [],
            history: {}, // "YYYY-MM-DD": true
            joined: new Date().toISOString().split('T')[0]
        };

        // Current target task context for reminder assignment
        let activeReminderTaskId = null;

        // --- UNIFIED HAPTIC VIBRATION MOTOR ---
        function triggerHaptic(type = 'light') {
            if (!navigator.vibrate) return;
            
            switch(type) {
                case 'light':
                    navigator.vibrate(15);
                    break;
                case 'medium':
                    navigator.vibrate(30);
                    break;
                case 'heavy':
                    navigator.vibrate(60);
                    break;
                case 'success':
                    navigator.vibrate([35, 40, 35]);
                    break;
                case 'alarm':
                    navigator.vibrate([100, 50, 100, 50, 100]);
                    break;
            }
        }

        function loadData() {
            try {
                const raw = localStorage.getItem(DB_KEY);
                if (raw) {
                    store = JSON.parse(raw);
                }
            } catch (e) {
                console.error("Save load failed", e);
            }
        }

        function saveData() {
            try {
                localStorage.setItem(DB_KEY, JSON.stringify(store));
            } catch (e) {
                alert("Error saving data. Make sure DOM Storage is enabled.");
            }
        }

        // --- THEME ENGINE ---
        function initTheme() {
            const savedTheme = localStorage.getItem(THEME_KEY);
            if (savedTheme === 'dark') document.body.classList.add('dark-mode');
            if (savedTheme === 'light') document.body.classList.add('light-mode');
        }

        document.getElementById('theme-toggle').onclick = () => {
            triggerHaptic('light');
            if (document.body.classList.contains('dark-mode')) {
                document.body.classList.remove('dark-mode');
                document.body.classList.add('light-mode');
                localStorage.setItem(THEME_KEY, 'light');
            } else {
                document.body.classList.remove('light-mode');
                document.body.classList.add('dark-mode');
                localStorage.setItem(THEME_KEY, 'dark');
            }
        };

        // --- APP LOGIC ---
        const getToday = () => new Date().toISOString().split('T')[0];
        const ui = {
            list: document.getElementById('task-list'),
            empty: document.getElementById('empty-state'),
            modal: document.getElementById('modal'),
            overlay: document.getElementById('overlay'),
            title: document.getElementById('inp-title'),
            desc: document.getElementById('inp-desc'),
            notifModal: document.getElementById('notif-modal'),
            notifOverlay: document.getElementById('notif-overlay'),
            notifTime: document.getElementById('inp-notif-time')
        };

function init() {
            loadData();
            initTheme();
            renderTasks();
            updateDate();
            initNotificationDispatcher();
            
            // --- NEW SPLASH SCREEN LOGIC ---
            const splash = document.getElementById('splash');
            
            // 1. Set the standard timer for ~1.2 seconds
            const splashTimer = setTimeout(() => {
                splash.style.opacity = '0';
                // Use display: none instead of visibility: hidden so it completely unmounts
                setTimeout(() => splash.style.display = 'none', 500); 
            }, 1300);

            // 2. The Skip Function
            const skipSplash = () => {
                clearTimeout(splashTimer);
                splash.style.display = 'none'; // Instantly vanish
            };

            // 3. Attach listeners
            splash.addEventListener('click', skipSplash);
            splash.addEventListener('touchstart', skipSplash);
        }

        function updateDate() {
            const d = new Date();
            document.getElementById('date-display').innerText = d.toLocaleDateString(undefined, {
                weekday: 'long', month: 'long', day: 'numeric'
            });
        }

        // --- TASK MANAGEMENT ---
        function renderTasks() {
            ui.list.innerHTML = "";
            if (store.tasks.length === 0) {
                ui.empty.style.display = 'block';
            } else {
                ui.empty.style.display = 'none';
                store.tasks.forEach(t => {
                    const div = document.createElement('div');
                    div.className = `task-card ${t.done ? 'completed' : ''}`;
                    
                    // Format scheduled string UI beautifully if it exists
                    let reminderBadgeHtml = '';
                    if (t.reminderTime) {
                        reminderBadgeHtml = `<div class="task-reminder-tag">⏰ ${formatTimeDisplay(t.reminderTime)}</div>`;
                    }

                    div.innerHTML = `
                        <div class="checkbox-wrapper">
                            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggle(${t.id})">
                            <div class="checkmark"></div>
                        </div>
                        <div class="task-content">
                            <div class="task-title">${esc(t.title)}</div>
                            ${t.desc ? `<div class="task-desc">${esc(t.desc)}</div>` : ''}
                            ${reminderBadgeHtml}
                        </div>
                        <div class="btn-action-container">
                            <button class="btn-bell ${t.reminderTime ? 'active' : ''}" onclick="event.stopPropagation(); openNotifModal(${t.id})">🔔</button>
                            <button class="btn-delete" onclick="event.stopPropagation(); del(${t.id})">✕</button>
                        </div>
                    `;
                    ui.list.appendChild(div);
                });
            }
            checkDayComplete();
        }

        function saveTask() {
            const title = ui.title.value.trim();
            if(!title) return; // Don't save empty
            
            store.tasks.push({
                id: Date.now(),
                title: title,
                desc: ui.desc.value.trim(),
                done: false,
                reminderTime: null, // Holds string representation "HH:MM"
                reminderFired: false
            });
            
            triggerHaptic('success');
            saveData();
            renderTasks();
            closeModal();
        }

        window.toggle = (id) => {
            const t = store.tasks.find(x => x.id === id);
            if(t) {
                t.done = !t.done;
                triggerHaptic(t.done ? 'success' : 'medium');
                saveData();
                renderTasks();
            }
        };

        window.del = (id) => {
            triggerHaptic('heavy');
            if(confirm("Delete task?")) {
                store.tasks = store.tasks.filter(x => x.id !== id);
                saveData();
                renderTasks();
            }
        };

        // --- NOTIFICATION MANAGEMENT CORE ENGINE ---
        function requestNotificationPermission() {
            if ("Notification" in window) {
                if (Notification.permission !== "granted" && Notification.permission !== "denied") {
                    Notification.requestPermission();
                }
            }
        }

        window.openNotifModal = (id) => {
            triggerHaptic('light');
            requestNotificationPermission();
            activeReminderTaskId = id;
            
            const t = store.tasks.find(x => x.id === id);
            if (t && t.reminderTime) {
                ui.notifTime.value = t.reminderTime;
                document.getElementById('btn-clear-reminder').style.display = 'block';
            } else {
                // Set default picker time values to current hour mark nicely
                const now = new Date();
                ui.notifTime.value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                document.getElementById('btn-clear-reminder').style.display = 'none';
            }

            ui.notifModal.classList.add('open');
            ui.notifOverlay.classList.add('active');
        };

        window.closeNotifModal = () => {
            ui.notifModal.classList.remove('open');
            ui.notifOverlay.classList.remove('active');
            activeReminderTaskId = null;
        };

        function saveReminder() {
            if (!ui.notifTime.value) return;
            
            const t = store.tasks.find(x => x.id === activeReminderTaskId);
            if (t) {
                t.reminderTime = ui.notifTime.value;
                t.reminderFired = false; // Reset threshold validation state
                triggerHaptic('success');
                saveData();
                renderTasks();
            }
            closeNotifModal();
        }

        function clearReminder() {
            const t = store.tasks.find(x => x.id === activeReminderTaskId);
            if (t) {
                t.reminderTime = null;
                t.reminderFired = false;
                triggerHaptic('medium');
                saveData();
                renderTasks();
            }
            closeNotifModal();
        }

        function initNotificationDispatcher() {
            // Heartbeat ticking every 15 seconds to parse schedules without battery drain
            setInterval(() => {
                const now = new Date();
                const currentStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

                store.tasks.forEach(t => {
                    if (!t.done && t.reminderTime === currentStr && !t.reminderFired) {
                        t.reminderFired = true;
                        saveData();
                        fireSystemNotification(t);
                    }
                });
            }, 15000);
        }

        function fireSystemNotification(task) {
            triggerHaptic('alarm');
            
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("Taskiee Reminder!", {
                    body: `${task.title}${task.desc ? ` - ${task.desc}` : ''}`,
                    icon: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%236c5ce7"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>'
                });
            } else {
                // Inline fallbacks if permission context was denied or unsupported
                alert(`⏰ Reminder: ${task.title}`);
            }
        }

        function formatTimeDisplay(timeStr) {
            if(!timeStr) return '';
            const parts = timeStr.split(':');
            let hours = parseInt(parts[0], 10);
            const minutes = parts[1];
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; // system midnight normalization
            return `${hours}:${minutes} ${ampm}`;
        }

        // --- HISTORY & CALENDAR ---
        function checkDayComplete() {
            const today = getToday();
            // Logic: Must have at least 1 task and ALL must be done
            const allDone = store.tasks.length > 0 && store.tasks.every(t => t.done);
            
            if (allDone) {
                store.history[today] = true;
            } else {
                delete store.history[today];
            }
            saveData();
        }

        function renderHistory() {
            // 1. Streak
            let streak = 0;
            const today = new Date();
            for(let i=0; i<365; i++) {
                const d = new Date();
                d.setDate(today.getDate() - i);
                const k = d.toISOString().split('T')[0];
                if(i===0 && !store.history[k]) continue; // Skip today if incomplete
                if(store.history[k]) streak++;
                else if(i > 0) break;
            }
            document.getElementById('streak-val').innerText = streak;

            // 2. Calendar (Current Month)
            const cal = document.getElementById('calendar');
            cal.innerHTML = "";
            const y = today.getFullYear(), m = today.getMonth();
            const daysInMonth = new Date(y, m+1, 0).getDate();
            const firstDay = new Date(y, m, 1).getDay();

            // Headers
            "SMTWTFS".split('').forEach(d => cal.innerHTML += `<div style="text-align:center; font-size:10px; color:#888">${d}</div>`);
            
            // Empties
            for(let i=0; i<firstDay; i++) cal.innerHTML += `<div></div>`;

            // Days
            for(let i=1; i<=daysInMonth; i++) {
                const k = `${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                const isDone = store.history[k];
                cal.innerHTML += `<div class="cal-day ${isDone ? 'done' : ''}">${i}</div>`;
            }
        }

        // --- NAVIGATION ---
        window.nav = (page, el) => {
            triggerHaptic('light');
            document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
            document.getElementById(`page-${page}`).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
            el.classList.add('active');

            if(page === 'history') renderHistory();
            
            // Hide FAB on history
            document.querySelector('.fab').style.display = page === 'today' ? 'flex' : 'none';
        };
window.openModal = () => {
            triggerHaptic('light');
            ui.modal.classList.add('open');
            ui.overlay.classList.add('active');
            
            // FIX: Delay focus so the keyboard slide doesn't conflict with CSS transition
            setTimeout(() => {
                ui.title.focus();
            }, 300);
        };

        window.closeModal = () => {
            ui.modal.classList.remove('open');
            ui.overlay.classList.remove('active');
            ui.title.value = "";
            ui.desc.value = "";
            
            // FIX: Explicitly drop keyboard focus to prevent layout hanging
            if (document.activeElement) {
                document.activeElement.blur();
            }
        };
        const esc = (txt) => txt.replace(/</g, "&lt;").replace(/>/g, "&gt;");

        // Start
        init();
    </script>
</body>
</html>
