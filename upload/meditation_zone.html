<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura - Meditation & Focus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  /* 🟤 Change text selection color */
  ::selection {
    background: brown;
    color: white;
  }

  /* 📱 Remove blue tap highlight on mobile */
  * {
    -webkit-tap-highlight-color: transparent;
  }

  /* 🚫 Prevent dragging links */
  a {
    -webkit-user-drag: none;
    user-drag: none;
  }
</style>

<script>
  // 🚫 Disable right-click
  document.addEventListener("contextmenu", e => e.preventDefault());

  // 🚫 Block common DevTools shortcuts
  document.addEventListener("keydown", e => {
    if (
      (e.ctrlKey && e.shiftKey && ["I","J","C"].includes(e.key.toUpperCase())) || // Ctrl+Shift+I/J/C
      (e.ctrlKey && e.key.toUpperCase() === "U") || // Ctrl+U (view source)
      (e.key === "F12") // F12
    ) {
      e.preventDefault();
    }
  });
</script>

    <style>
        /* ==========================================================================
           Aura - Premium Meditation & Focus App Styles
           ========================================================================== */
        :root {
            --bg-1: #0f0c29;
            --bg-2: #302b63;
            --bg-3: #24243e;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --anim-factor: 1;
        }

        [data-theme="light"] {
            --bg-1: #e0eafc;
            --bg-2: #cfdef3;
            --bg-3: #ffffff;
            --text: #1a1a1a;
            --text-muted: rgba(0, 0, 0, 0.6);
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.6);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            transition: background 0.8s ease, color 0.3s ease;
        }

        /* Loader */
        #loader {
            position: fixed; inset: 0; z-index: 9999;
            background: var(--bg-1);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        #loader.hidden { opacity: 0; visibility: hidden; }
        .loader-circle {
            width: 80px; height: 80px;
            border: 3px solid transparent;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite, breathe 3s ease-in-out infinite;
            margin-bottom: 20px;
        }
        #loader p { font-family: 'Lora', serif; font-style: italic; opacity: 0.7; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }

        /* Background Effects */
        #bg-effects { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
        #particle-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
        .aurora {
            position: absolute; width: 600px; height: 600px;
            border-radius: 50%; filter: blur(80px);
            opacity: 0.4; mix-blend-mode: screen;
            animation: float 20s ease-in-out infinite;
            animation-duration: calc(20s / var(--anim-factor));
        }
        .aurora-1 { top: -10%; left: -10%; background: var(--accent); }
        .aurora-2 { bottom: -10%; right: -10%; background: #06b6d4; animation-delay: -5s; }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(100px, -50px) scale(1.1); }
            66% { transform: translate(-50px, 100px) scale(0.9); }
        }
        [data-theme="light"] .aurora { opacity: 0.2; mix-blend-mode: multiply; }

        /* App Layout */
        #app { display: flex; height: 100vh; }

        /* Sidebar */
        #sidebar {
            width: 240px; padding: 24px 16px;
            display: flex; flex-direction: column;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border-right: 1px solid var(--glass-border);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }
        .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; padding: 0 12px; }
        .logo i { font-size: 24px; color: var(--accent); }
        .logo span { font-family: 'Lora', serif; font-size: 24px; font-weight: 500; }

        nav { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .nav-link {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 16px; border-radius: 12px;
            color: var(--text-muted); text-decoration: none;
            font-weight: 500; transition: all 0.3s ease;
            font-size: 14px;
        }
        .nav-link:hover { color: var(--text); background: rgba(255,255,255,0.05); }
        .nav-link.active { color: var(--text); background: var(--accent); box-shadow: 0 4px 12px var(--accent-glow); }
        .nav-link i { width: 20px; text-align: center; }

        .sidebar-footer { display: flex; flex-direction: column; gap: 8px; }
        .sidebar-footer button {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 16px; border-radius: 10px;
            background: transparent; border: none; color: var(--text-muted);
            cursor: pointer; font-size: 13px; font-family: inherit;
            transition: all 0.3s;
        }
        .sidebar-footer button:hover { color: var(--text); background: rgba(255,255,255,0.05); }

        /* Main Content */
        #main-content { flex: 1; overflow-y: auto; position: relative; }
        #top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 24px 32px; position: sticky; top: 0;
            background: linear-gradient(to bottom, var(--bg-1) 0%, transparent 100%);
            z-index: 50;
        }
        #menu-toggle { display: none; background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; }
        #greeting { font-family: 'Lora', serif; font-size: 28px; font-weight: 500; }
        .top-actions button { background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text); width: 40px; height: 40px; border-radius: 10px; cursor: pointer; backdrop-filter: blur(8px); transition: all 0.3s; }
        .top-actions button:hover { background: var(--accent); color: white; }

        #view-container { padding: 0 32px 48px; animation: fadeIn 0.6s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Glass Cards */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px var(--accent-glow); }

        /* Grid Layouts */
        .grid { display: grid; gap: 24px; }
        .grid-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        .grid-3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

        /* Typography */
        h3 { font-family: 'Lora', serif; font-size: 20px; margin-bottom: 16px; }
        .text-muted { color: var(--text-muted); }
        .serif { font-family: 'Lora', serif; font-style: italic; }

        /* Buttons */
        .btn {
            background: var(--accent); color: white; border: none;
            padding: 12px 24px; border-radius: 12px; cursor: pointer;
            font-family: inherit; font-weight: 600; font-size: 14px;
            transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px;
        }
        .btn:hover { box-shadow: 0 8px 20px var(--accent-glow); transform: translateY(-2px); }
        .btn-outline { background: transparent; border: 1px solid var(--glass-border); color: var(--text); }
        .btn-outline:hover { background: rgba(255,255,255,0.05); box-shadow: none; }

        /* Meditation Breathing Circle */
        .breathing-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 400px; position: relative; }
        .breath-circle {
            width: 200px; height: 200px; border-radius: 50%;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            animation: breathe 8s ease-in-out infinite;
            animation-duration: calc(8s / var(--anim-factor));
            box-shadow: 0 0 40px var(--accent-glow);
        }
        .breath-text { font-family: 'Lora', serif; font-size: 24px; font-style: italic; }

        /* Timer Ring */
        .timer-ring-container { position: relative; width: 280px; height: 280px; margin: 0 auto; }
        .timer-ring { transform: rotate(-90deg); width: 100%; height: 100%; }
        .timer-bg { fill: none; stroke: var(--glass-border); stroke-width: 8; }
        .timer-progress { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
        .timer-text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .timer-text .time { font-size: 48px; font-weight: 300; font-family: 'Lora', serif; }
        .timer-text .label { color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 2px; }

        /* Sound Mixer */
        .sound-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 16px; }
        .sound-tile {
            aspect-ratio: 1; border-radius: 20px; border: 1px solid var(--glass-border);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 8px; cursor: pointer; transition: all 0.3s; background: var(--glass-bg);
            position: relative; overflow: hidden;
        }
        .sound-tile:hover { border-color: var(--accent); }
        .sound-tile.active { background: var(--accent); border-color: transparent; box-shadow: 0 0 20px var(--accent-glow); }
        .sound-tile i { font-size: 24px; }
        .sound-tile span { font-size: 11px; font-weight: 500; }
        .sound-tile .volume-slider {
            position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
            -webkit-appearance: none; background: transparent; cursor: pointer; opacity: 0;
            transition: opacity 0.3s;
        }
        .sound-tile.active .volume-slider { opacity: 1; height: 6px; }
        .sound-tile .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 6px; height: 6px; background: white; border-radius: 50%; }

        /* Utilities (Todo, Notes) */
        .todo-input { width: 100%; padding: 12px; border-radius: 10px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); color: var(--text); margin-bottom: 16px; font-family: inherit; }
        .todo-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid var(--glass-border); }
        .todo-item.completed span { text-decoration: line-through; color: var(--text-muted); }
        .todo-checkbox { width: 20px; height: 20px; border: 2px solid var(--text-muted); border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .todo-checkbox.checked { background: var(--accent); border-color: var(--accent); }
        .todo-checkbox.checked::after { content: '✓'; color: white; font-size: 12px; font-weight: bold; }

        /* Memory Game */
        .memory-grid { display: grid; gap: 12px; margin-top: 20px; }
        .memory-btn { width: 100%; aspect-ratio: 1; border-radius: 16px; border: 1px solid var(--glass-border); background: var(--glass-bg); cursor: pointer; transition: all 0.2s; font-size: 24px; color: var(--text); }
        .memory-btn:active { transform: scale(0.95); }
        .memory-btn.flash { background: var(--accent); transform: scale(1.05); }

        /* Modal */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { width: 90%; max-width: 400px; padding: 32px; position: relative; }
        .close-modal { position: absolute; top: 16px; right: 16px; background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; }
        .setting-group { margin-bottom: 24px; }
        .setting-group label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-muted); }
        .color-picker { display: flex; gap: 8px; }
        .color-swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: all 0.2s; }
        .color-swatch.active { border-color: var(--text); transform: scale(1.1); }
        input[type="range"] { width: 100%; accent-color: var(--accent); }

        /* Zen Mode */
        body.zen-mode #sidebar, body.zen-mode #top-bar { opacity: 0; pointer-events: none; transform: translateX(-100%); }
        body.zen-mode #view-container { padding: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }

        /* Responsive */
        @media (max-width: 768px) {
            #sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
            #menu-toggle { display: block; }
            #view-container { padding: 0 16px 32px; }
            #greeting { font-size: 22px; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* Footer */
        .app-footer { text-align: center; padding: 24px; color: var(--text-muted); font-size: 12px; border-top: 1px solid var(--glass-border); margin-top: 48px; }
    </style>
</head>
<body>

    </div>

    <!-- App Container -->
    <div id="app">

        <aside id="sidebar">

        <!-- Main Content -->
        <main id="main-content">

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content card">
            <button class="close-modal">&times;</button>

            <div class="setting-group">
                <label>Accent Color</label>
                <div class="color-picker">
                    <button class="color-swatch" data-color="#8b5cf6" style="background:#8b5cf6"></button>
                    <button class="color-swatch" data-color="#06b6d4" style="background:#06b6d4"></button>
                    <button class="color-swatch" data-color="#10b981" style="background:#10b981"></button>
                    <button class="color-swatch" data-color="#f43f5e" style="background:#f43f5e"></button>
                    <button class="color-swatch" data-color="#f59e0b" style="background:#f59e0b"></button>
                </div>

                <label>Animation Intensity</label>

            </div>

    <script>
        /* ==========================================================================
           Aura - App Logic & Web Audio Engine
           ========================================================================== */

        // ---------- State Management ----------
        const Store = {
            get: (key, def) => JSON.parse(localStorage.getItem('aura_' + key)) || def,
            set: (key, val) => localStorage.setItem('aura_' + key, JSON.stringify(val))
        };

        const App = {
            currentView: 'dashboard',
            timer: null,
            breathInterval: null,
            soundEngine: null
        };

        // ---------- Web Audio Procedural Sound Engine ----------
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.activeSounds = {};
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.connect(this.ctx.destination);
                }
                if (this.ctx.state === 'suspended') this.ctx.resume();
            }

            createNoiseBuffer(type = 'white') {
                const bufferSize = 2 * this.ctx.sampleRate;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                let lastOut = 0;
                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    if (type === 'brown') {
                        data[i] = (lastOut + (0.02 * white)) / 1.02;
                        lastOut = data[i];
                        data[i] *= 3.5;
                    } else if (type === 'pink') {
                        data[i] = (white + lastOut) / 2;
                        lastOut = data[i];
                    } else {
                        data[i] = white;
                    }
                }
                return buffer;
            }

            playSound(name) {
                this.init();
                if (this.activeSounds[name]) return;

                const source = this.ctx.createBufferSource();
                const gain = this.ctx.createGain();
                const filter = this.ctx.createBiquadFilter();
                gain.gain.value = 0.5; // Default volume

                let bufferType = 'white';
                let filterFreq = 1000;

                switch(name) {
                    case 'rain': bufferType = 'white'; filterFreq = 1200; filter.type = 'lowpass'; break;
                    case 'ocean': bufferType = 'brown'; filterFreq = 400; filter.type = 'lowpass'; break;
                    case 'wind': bufferType = 'pink'; filterFreq = 600; filter.type = 'bandpass'; break;
                    case 'forest': bufferType = 'pink'; filterFreq = 2000; filter.type = 'highpass'; break;
                    case 'white-noise': bufferType = 'white'; filterFreq = 0; break;
                    case 'brown-noise': bufferType = 'brown'; filterFreq = 0; break;
                    case 'pink-noise': bufferType = 'pink'; filterFreq = 0; break;
                    default: bufferType = 'white'; filterFreq = 1000;
                }

                source.buffer = this.createNoiseBuffer(bufferType);
                
                if (filterFreq > 0) {
                    source.connect(filter); 
                    filter.connect(gain); 
                } else {
                    source.connect(gain);
                }
                
                gain.connect(this.masterGain);

                // LFO for Ocean effect (volume swells)
                let lfo = null;
                if (name === 'ocean') {
                    lfo = this.ctx.createOscillator();
                    const lfoGain = this.ctx.createGain();
                    lfo.frequency.value = 0.1; // Slow wave
                    lfoGain.gain.value = 0.3;
                    lfo.connect(lfoGain); 
                    lfoGain.connect(gain.gain);
                    lfo.start();
                }

                source.loop = true;
                source.start();
                this.activeSounds[name] = { source, gain, lfo };
            }

            stopSound(name) {
                const sound = this.activeSounds[name];
                if (!sound) return;
                sound.source.stop();
                if (sound.lfo) sound.lfo.stop();
                delete this.activeSounds[name];
            }

            setVolume(name, vol) {
                if (this.activeSounds[name]) {
                    this.activeSounds[name].gain.gain.value = vol;
                }
            }
        }

        // ---------- Views Renderer ----------
        const Views = {
            dashboard: () => `
                <div class="grid grid-2">
                    <div class="card">
                        <h3>Daily Wellness</h3>
                        <p class="serif text-muted" id="daily-quote">"The mind is everything. What you think you become."</p>
                        <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--glass-border);">
                            <p><strong>Mindfulness Tip:</strong> <span class="text-muted">Try the 5-4-3-2-1 grounding technique today.</span></p>
                            <p style="margin-top: 8px;"><strong>Gratitude Prompt:</strong> <span class="text-muted">What is one small thing that brought you joy today?</span></p>
                        </div>
                    </div>
                    <div class="card">
                        <h3>Productivity Score</h3>
                        <div style="font-size: 48px; font-weight: 300; color: var(--accent);">86<span style="font-size: 20px;">/100</span></div>
                        <p class="text-muted">You're on a 3-day streak. Keep it up!</p>
                        <div style="display: flex; gap: 4px; margin-top: 16px;">
                            ${Array(7).fill().map((_,i) => `<div style="flex:1; height: 24px; background: ${i < 4 ? 'var(--accent)' : 'var(--glass-border)'}; border-radius: 4px;"></div>`).join('')}
                        </div>
                    </div>
                    <div class="card" style="grid-column: span 2;">
                        <h3>Weekly Activity</h3>
                        <div style="display: flex; gap: 16px; height: 100px; align-items: flex-end;">
                            ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `
                                <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;">
                                    <div style="width: 100%; background: var(--accent); border-radius: 6px 6px 0 0; height: ${Math.random()*80 + 20}%; opacity: 0.8;"></div>
                                    <span class="text-muted" style="font-size: 11px;">${d}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `,

            meditate: () => `
                <div class="card" style="max-width: 600px; margin: 0 auto;">
                    <div class="breathing-container">
                        <div class="breath-circle">
                            <span class="breath-text" id="breath-text">Breathe</span>
                        </div>
                        <div style="margin-top: 48px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                            <button class="btn" onclick="Meditation.start(5)">5 Min</button>
                            <button class="btn btn-outline" onclick="Meditation.start(10)">10 Min</button>
                            <button class="btn btn-outline" onclick="Meditation.start(15)">15 Min</button>
                            <button class="btn btn-outline" onclick="Meditation.start(20)">20 Min</button>
                            <button class="btn btn-outline" onclick="Meditation.stop()">Stop</button>
                        </div>
                    </div>
                </div>
            `,

            focus: () => `
                <div class="grid grid-2">
                    <div class="card" style="text-align: center;">
                        <h3>Focus Timer</h3>
                        <div class="timer-ring-container" style="margin: 24px auto;">
                            <svg class="timer-ring" viewBox="0 0 200 200">
                                <circle class="timer-bg" cx="100" cy="100" r="90"></circle>
                                <circle class="timer-progress" id="focus-ring" cx="100" cy="100" r="90" stroke-dasharray="565.48" stroke-dashoffset="0"></circle>
                            </svg>
                            <div class="timer-text">
                                <span class="time" id="focus-time">25:00</span>
                                <span class="label">Deep Focus</span>
                            </div>
                        </div>
                        <button class="btn" onclick="Timer.start('focus', 25)">Start Focus</button>

                    <div class="card">
                        <h3>Inspiration</h3>
                        <p class="serif" style="font-size: 20px; line-height: 1.6;">"Concentrate all your thoughts upon the work at hand. The sun's rays do not burn until brought to a focus."</p>
                        <p class="text-muted" style="margin-top: 12px;">- Alexander Graham Bell</p>
                        <div style="margin-top: 24px;">
                            <h3>Ambience</h3>
                            <div style="display: flex; gap: 8px;">
                                <button class="btn btn-outline" onclick="App.soundEngine.playSound('rain')"><i class="fas fa-cloud-rain"></i></button>
                                <button class="btn btn-outline" onclick="App.soundEngine.playSound('forest')"><i class="fas fa-tree"></i></button>
                                <button class="btn btn-outline" onclick="App.soundEngine.playSound('brown-noise')"><i class="fas fa-wave-square"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            `,

            pomodoro: () => `
                <div class="card" style="max-width: 500px; margin: 0 auto; text-align: center;">
                    <h3>Pomodoro Timer</h3>
                    <div style="display: flex; gap: 8px; justify-content: center; margin-bottom: 24px;">
                        <button class="btn btn-outline" id="pomo-work-btn" onclick="Timer.setPomodoro('work')">Work (25m)</button>
                        <button class="btn btn-outline" id="pomo-short-btn" onclick="Timer.setPomodoro('short')">Short Break (5m)</button>
                        <button class="btn btn-outline" id="pomo-long-btn" onclick="Timer.setPomodoro('long')">Long Break (15m)</button>
                    </div>
                    <div class="timer-ring-container">
                        <svg class="timer-ring" viewBox="0 0 200 200">
                            <circle class="timer-bg" cx="100" cy="100" r="90"></circle>
                            <circle class="timer-progress" id="pomo-ring" cx="100" cy="100" r="90" stroke-dasharray="565.48" stroke-dashoffset="0"></circle>
                        </svg>
                        <div class="timer-text">
                            <span class="time" id="pomo-time">25:00</span>
                            <span class="label">Time to focus</span>
                        </div>
                    </div>
                    <div style="margin-top: 24px; display: flex; gap: 12px; justify-content: center;">
                        <button class="btn" onclick="Timer.startPomodoro()">Start</button>
                        <button class="btn btn-outline" onclick="Timer.pause()">Pause</button>
                        <button class="btn btn-outline" onclick="Timer.reset()">Reset</button>
                    </div>
                    <p class="text-muted" style="margin-top: 16px;">Cycle: <span id="pomo-cycle">1</span></p>
                </div>
            `,

            memory: () => `
                <div class="card">
                    <h3>Memory Training</h3>
                    <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                        <button class="btn btn-outline" onclick="MemoryGame.start('sequence')">Sequence</button>
                        <button class="btn btn-outline" onclick="MemoryGame.start('numbers')">Number Recall</button>
                    </div>
                    <div id="memory-game-area" style="min-height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                        <p class="text-muted">Select a game above to begin training your memory.</p>
                    </div>
                </div>
            `,

            soundscape: () => {
                const sounds = [
                    {id: 'rain', icon: 'cloud-rain', name: 'Rain'}, {id: 'ocean', icon: 'water', name: 'Ocean'},
                    {id: 'forest', icon: 'tree', name: 'Forest'}, {id: 'wind', icon: 'wind', name: 'Wind'},
                    {id: 'white-noise', icon: 'volume-high', name: 'White'}, {id: 'brown-noise', icon: 'volume-low', name: 'Brown'},
                    {id: 'pink-noise', icon: 'volume-off', name: 'Pink'}, {id: 'fire', icon: 'fire', name: 'Fireplace'}
                ];
                return `
                    <div class="card">
                        <h3>Soundscapes</h3>
                        <p class="text-muted" style="margin-bottom: 24px;">Mix multiple ambient sounds to create your perfect environment.</p>
                        <div class="sound-grid">
                            ${sounds.map(s => `
                                <div class="sound-tile" id="sound-${s.id}" onclick="SoundToggle.toggle('${s.id}')">
                                    <i class="fas fa-${s.icon}"></i>
                                    <span>${s.name}</span>
                                    <input type="range" class="volume-slider" min="0" max="1" step="0.1" value="0.5" onclick="event.stopPropagation()" oninput="SoundToggle.setVol('${s.id}', this.value)"/>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            },

            utilities: () => `
                <div class="grid grid-2">
                    <div class="card">
                        <h3>To-Do List</h3>
                        <input type="text" class="todo-input" placeholder="Add a task..." id="todo-input">
                        <div id="todo-list"></div>
                    </div>
                    <div class="card">
                        <h3>Mood Tracker</h3>
                        <p class="text-muted">How are you feeling right now?</p>
                        <div style="display: flex; gap: 12px; font-size: 32px; margin-top: 16px; cursor: pointer;">
                            <span onclick="Utilities.logMood('😀')">😀</span>
                            <span onclick="Utilities.logMood('😐')">😐</span>
                            <span onclick="Utilities.logMood('😔')">😔</span>
                            <span onclick="Utilities.logMood('😫')">😫</span>
                            <span onclick="Utilities.logMood('😡')">😡</span>
                        </div>
                        <div style="margin-top: 24px;">
                            <h3>Quick Journal</h3>
                            <textarea class="todo-input" style="min-height: 80px;" placeholder="Write your thoughts..." id="journal-entry"></textarea>
                            <button class="btn" style="margin-top: 8px;" onclick="Utilities.saveJournal()">Save Entry</button>
                        </div>
                    </div>
                </div>
            `
        };

        // ---------- Core Modules ----------
        const Timer = {
            duration: 25 * 60,
            remaining: 25 * 60,
            running: false,
            mode: 'work',
            
            start(type, mins) {
                if (type === 'focus') {
                    this.duration = mins * 60;
                    this.remaining = mins * 60;
                    this.render('focus');
                }
                this.run();
            },

            setPomodoro(mode) {
                this.pause();
                this.mode = mode;
                const durations = { work: 25, short: 5, long: 15 };
                this.duration = durations[mode] * 60;
                this.remaining = this.duration;
                
                document.querySelectorAll('[id^=pomo-]').forEach(b => b.classList.remove('active'));
                const activeBtn = document.getElementById(`pomo-${mode}-btn`);
                if(activeBtn) activeBtn.classList.add('active');
                this.render('pomo');
            },

            startPomodoro() {
                this.run();
            },

            run() {
                if (this.running) return;
                this.running = true;
                App.timer = setInterval(() => {
                    this.remaining--;
                    this.render(App.currentView === 'pomodoro' ? 'pomo' : 'focus');
                    if (this.remaining <= 0) {
                        this.pause();
                        this.complete();
                    }
                }, 1000);
            },

            pause() { clearInterval(App.timer); this.running = false; },
            reset() { this.pause(); this.remaining = this.duration; this.render('pomo'); },
            
            complete() {
                Notify.send('Time is up!', 'Great job. Take a break.');
                if (this.mode === 'work') {
                    Store.set('pomodoro_count', Store.get('pomodoro_count', 0) + 1);
                    this.setPomodoro('short');
                } else {
                    this.setPomodoro('work');
                }
                this.run();
            },

            render(type) {
                const mins = Math.floor(this.remaining / 60);
                const secs = this.remaining % 60;
                const timeStr = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
                
                if (type === 'pomo') {
                    const pomoTime = document.getElementById('pomo-time');
                    if(pomoTime) pomoTime.textContent = timeStr;
                    const ring = document.getElementById('pomo-ring');
                    if (ring) {
                        const offset = 565.48 * (1 - this.remaining / this.duration);
                        ring.style.strokeDashoffset = offset;
                    }
                } else {
                    const el = document.getElementById('focus-time');
                    if (el) el.textContent = timeStr;
                    const ring = document.getElementById('focus-ring');
                    if (ring) {
                        const offset = 565.48 * (1 - this.remaining / this.duration);
                        ring.style.strokeDashoffset = offset;
                    }
                }
            }
        };

        const Meditation = {
            running: false,
            duration: 5,
            
            start(mins) {
                this.duration = mins;
                this.running = true;
                let time = mins * 60;
                const phases = ['Inhale', 'Hold', 'Exhale', 'Hold'];
                let phaseIdx = 0;
                
                const breathText = document.getElementById('breath-text');
                if (breathText) breathText.textContent = phases[0];
                
                clearInterval(App.breathInterval);
                App.breathInterval = setInterval(() => {
                    phaseIdx = (phaseIdx + 1) % 4;
                    if (breathText) breathText.textContent = phases[phaseIdx];
                }, 4000);

                clearInterval(App.timer);
                App.timer = setInterval(() => {
                    time--;
                    if (time <= 0) this.stop();
                }, 1000);
                Notify.send('Meditation Started', 'Find a comfortable position and relax.');
            },
            
            stop() {
                clearInterval(App.timer);
                clearInterval(App.breathInterval);
                this.running = false;
                const breathText = document.getElementById('breath-text');
                if (breathText) breathText.textContent = 'Breathe';
                Notify.send('Session Complete', 'You\'ve successfully completed your meditation.');
            }
        };

        const MemoryGame = {
            sequence: [],
            userSeq: [],
            
            start(type) {
                const area = document.getElementById('memory-game-area');
                if (type === 'sequence') {
                    area.innerHTML = `
                        <p class="text-muted">Watch the sequence, then repeat it.</p>
                        <div class="memory-grid" style="grid-template-columns: repeat(3, 100px); width: 336px;">
                            ${Array(9).fill().map((_,i) => `<button class="memory-btn" id="seq-${i}" onclick="MemoryGame.checkSeq(${i})"></button>`).join('')}
                        </div>
                        <button class="btn" style="margin-top: 24px;" onclick="MemoryGame.playSeq()">Start Sequence</button>
                    `;
                } else if (type === 'numbers') {
                    const num = Math.floor(Math.random() * 9000) + 1000;
                    area.innerHTML = `
                        <p class="text-muted">Memorize this number:</p>
                        <h1 style="font-size: 48px; letter-spacing: 8px; margin: 16px 0;" id="num-display">${num}</h1>
                        <div id="num-hidden" style="display:none; flex-direction: column; align-items: center; gap: 16px;">
                            <input type="number" class="todo-input" style="max-width: 200px; text-align: center; font-size: 24px;" placeholder="Enter number" id="num-input">
                            <button class="btn" onclick="MemoryGame.checkNum(${num})">Check</button>
                        </div>
                        <button class="btn" id="num-start" onclick="MemoryGame.hideNum()">Start</button>
                    `;
                }
            },
            
            hideNum() {
                document.getElementById('num-start').style.display = 'none';
                document.getElementById('num-hidden').style.display = 'flex';
                setTimeout(() => {
                    const disp = document.getElementById('num-display');
                    if(disp) disp.style.display = 'none';
                }, 3000);
            },
            
            playSeq() {
                this.sequence = Array(4).fill().map(() => Math.floor(Math.random() * 9));
                this.userSeq = [];
                this.sequence.forEach((idx, i) => {
                    setTimeout(() => {
                        const btn = document.getElementById(`seq-${idx}`);
                        if(btn) {
                            btn.classList.add('flash');
                            setTimeout(() => btn.classList.remove('flash'), 500);
                        }
                    }, i * 800);
                });
            },
            
            checkSeq(idx) {
                this.userSeq.push(idx);
                const btn = document.getElementById(`seq-${idx}`);
                if(btn) {
                    btn.classList.add('flash');
                    setTimeout(() => btn.classList.remove('flash'), 300);
                }
                
                if (this.userSeq[this.userSeq.length - 1] !== this.sequence[this.userSeq.length - 1]) {
                    Notify.send('Game Over', 'Wrong sequence!');
                    this.start('sequence');
                } else if (this.userSeq.length === this.sequence.length) {
                    Notify.send('Perfect!', 'You got the sequence right!');
                }
            },
            
            checkNum(actual) {
                const input = document.getElementById('num-input').value;
                if (parseInt(input) === actual) Notify.send('Correct!', 'Great memory!');
                else Notify.send('Incorrect', `The number was ${actual}`);
                this.start('numbers');
            }
        };

        const SoundToggle = {
            toggle(id) {
                const tile = document.getElementById(`sound-${id}`);
                if (!tile) return;
                if (tile.classList.contains('active')) {
                    App.soundEngine.stopSound(id);
                    tile.classList.remove('active');
                } else {
                    App.soundEngine.playSound(id);
                    tile.classList.add('active');
                }
            },
            setVol(id, vol) {
                App.soundEngine.setVolume(id, parseFloat(vol));
            }
        };

        const Utilities = {
            setup() {
                const input = document.getElementById('todo-input');
                if(input) {
                    input.addEventListener('keypress', (e) => {
                        if(e.key === 'Enter') {
                            this.addTodo(e.target.value);
                            e.target.value = '';
                        }
                    });
                }
                this.renderTodos();
            },
            renderTodos() {
                const list = document.getElementById('todo-list');
                if (!list) return;
                const todos = Store.get('todos', []);
                list.innerHTML = todos.map((t, i) => `
                    <div class="todo-item">
                        <div class="todo-checkbox ${t.done ? 'checked' : ''}" onclick="Utilities.toggleTodo(${i})"></div>
                        <span class="${t.done ? 'text-muted' : ''}">${t.text}</span>
                    </div>
                `).join('');
            },
            addTodo(text) {
                if (!text) return;
                const todos = Store.get('todos', []);
                todos.push({ text, done: false });
                Store.set('todos', todos);
                this.renderTodos();
            },
            toggleTodo(i) {
                const todos = Store.get('todos', []);
                todos[i].done = !todos[i].done;
                Store.set('todos', todos);
                this.renderTodos();
            },
            logMood(emoji) {
                const moods = Store.get('moods', []);
                moods.push({ date: new Date().toISOString(), mood: emoji });
                Store.set('moods', moods);
                Notify.send('Mood Logged', `You felt ${emoji} today.`);
            },
            saveJournal() {
                const entry = document.getElementById('journal-entry').value;
                if (!entry) return;
                const journal = Store.get('journal', []);
                journal.push({ date: new Date().toISOString(), text: entry });
                Store.set('journal', journal);
                document.getElementById('journal-entry').value = '';
                Notify.send('Journal Saved', 'Your thoughts are recorded.');
            }
        };

        const Notify = {
            send(title, body) {
                if ('Notification' in window && Notification.permission === 'granted') {
                    new Notification(title, { body });
                } else if ('Notification' in window && Notification.permission !== 'denied') {
                    Notification.requestPermission().then(p => {
                        if (p === 'granted') new Notification(title, { body });
                    });
                }
            }
        };

        // ---------- Background Particles ----------
        class ParticleSystem {
            constructor() {
                this.canvas = document.getElementById('particle-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.init();
                this.animate();
            }
            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }
            init() {
                this.particles = [];
                const count = window.innerWidth < 768 ? 20 : 50;
                for (let i = 0; i < count; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        r: Math.random() * 2 + 0.5,
                        vx: (Math.random() - 0.5) * 0.2,
                        vy: (Math.random() - 0.5) * 0.2,
                        alpha: Math.random() * 0.5 + 0.2
                    });
                }
            }
            animate() {
                const animFactor = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--anim-factor')) || 1;
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.particles.forEach(p => {
                    p.x += p.vx * animFactor;
                    p.y += p.vy * animFactor;
                    if (p.x < 0 || p.x > this.canvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > this.canvas.height) p.vy *= -1;
                    
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    this.ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                    this.ctx.fill();
                });
                requestAnimationFrame(() => this.animate());
            }
        }

        // ---------- App Initialization ----------
        App.init = function() {
            // Loader
            setTimeout(() => {
                const loader = document.getElementById('loader');
                if(loader) loader.classList.add('hidden');
            }, 1500);

            // Audio Engine
            App.soundEngine = new SoundEngine();

            // Particles
            new ParticleSystem();

            // Theme
            const savedTheme = Store.get('theme', null);
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
            else if (!prefersDark) document.documentElement.setAttribute('data-theme', 'light');

            // Accent Color
            const accent = Store.get('accent', '#8b5cf6');
            document.documentElement.style.setProperty('--accent', accent);
            document.documentElement.style.setProperty('--accent-glow', accent + '66'); // Add alpha

            // Greeting
            const hour = new Date().getHours();
            let greeting = 'Good Morning';
            if (hour >= 12 && hour < 17) greeting = 'Good Afternoon';
            else if (hour >= 17) greeting = 'Good Evening';
            document.getElementById('greeting').textContent = greeting;

            // Render Initial View
            this.navigate('dashboard');

            // Event Listeners
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', e => {
                    e.preventDefault();
                    this.navigate(link.dataset.view);
                    if (window.innerWidth < 768) document.getElementById('sidebar').classList.remove('open');
                });
            });

            document.getElementById('menu-toggle').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('open');
            });

            document.getElementById('theme-toggle').addEventListener('click', () => {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                Store.set('theme', next);
            });

            document.getElementById('zen-mode-btn').addEventListener('click', () => {
                document.body.classList.toggle('zen-mode');
            });

            // Settings Modal
            const modal = document.getElementById('settings-modal');
            document.getElementById('settings-btn').addEventListener('click', () => modal.classList.add('active'));
            document.querySelector('.close-modal').addEventListener('click', () => modal.classList.remove('active'));
            
            document.querySelectorAll('.color-swatch').forEach(sw => {
                if (sw.dataset.color === accent) sw.classList.add('active');
                sw.addEventListener('click', () => {
                    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
                    sw.classList.add('active');
                    const color = sw.dataset.color;
                    document.documentElement.style.setProperty('--accent', color);
                    document.documentElement.style.setProperty('--accent-glow', color + '66');
                    Store.set('accent', color);
                });
            });

            document.getElementById('anim-slider').addEventListener('input', e => {
                const val = e.target.value;
                const factor = val === '0' ? '0.001' : val;
                document.documentElement.style.setProperty('--anim-factor', factor);
                Store.set('anim', val);
            });
            
            const savedAnim = Store.get('anim', '1');
            document.getElementById('anim-slider').value = savedAnim;
            document.documentElement.style.setProperty('--anim-factor', savedAnim === '0' ? '0.001' : savedAnim);

            // Request Notification Permission
            if ('Notification' in window) {
                Notification.requestPermission();
            }

            // Keyboard Shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.key === 'f') document.documentElement.requestFullscreen();
                if (e.key === 'z') document.body.classList.toggle('zen-mode');
                if (e.key === 't') document.getElementById('theme-toggle').click();
            });
        };

        App.navigate = function(view) {
            this.currentView = view;
            document.querySelectorAll('.nav-link').forEach(l => l.classList.toggle('active', l.dataset.view === view));
            const container = document.getElementById('view-container');
            container.style.opacity = '0';
            
            setTimeout(() => {
                if (Views[view]) {
                    container.innerHTML = Views[view]() + `<div class="app-footer">© Adeshjeet_Official</div>`;
                    container.style.opacity = '1';
                    
                    if (view === 'utilities') Utilities.setup();
                }
            }, 200);
        };

        // Start App
        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
