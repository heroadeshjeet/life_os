<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeOS Vault - Your Personal Secured Vault</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&family=Playfair+Display:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#06060c;--bg1:#0e0e18;--bg2:#161623;--bg3:#1e1e30;
  --accent:#c9a227;--accent-l:#e8c847;--accent-d:#a07d12;
  --txt:#eeeef5;--txt2:#7a7a98;--border:#28283e;
  --ok:#22c55e;--err:#ef4444;--warn:#f59e0b;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Outfit',sans-serif;background:var(--bg0);color:var(--txt);overflow:hidden;height:100vh;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg1);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent-d);}
.font-display{font-family:'Playfair Display',serif;}

/* Lock Screen */
#lockScreen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 30%,#12122a 0%,#06060c 70%);}
.vault-ring{width:180px;height:180px;border:3px solid var(--border);border-radius:50%;position:relative;
  display:flex;align-items:center;justify-content:center;margin-bottom:2.5rem;}
.vault-ring::before{content:'';position:absolute;inset:-8px;border:1px solid rgba(201,162,39,.15);border-radius:50%;}
.vault-ring::after{content:'';position:absolute;inset:-16px;border:1px solid rgba(201,162,39,.07);border-radius:50%;}
.vault-ring .inner{width:90px;height:90px;background:linear-gradient(135deg,var(--accent),var(--accent-d));
  border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#000;
  box-shadow:0 0 40px rgba(201,162,39,.3);transition:transform .5s;}
.vault-ring.unlocked .inner{transform:rotate(360deg) scale(.8);opacity:.5;}
.pin-dot{width:16px;height:16px;border:2px solid var(--border);border-radius:50%;transition:all .2s;}
.pin-dot.filled{background:var(--accent);border-color:var(--accent);box-shadow:0 0 12px rgba(201,162,39,.5);}
.pin-dot.error{border-color:var(--err);background:var(--err);animation:shake .4s;}
.pin-btn{width:64px;height:64px;border:1px solid var(--border);border-radius:50%;background:var(--bg2);
  color:var(--txt);font-size:1.3rem;font-weight:600;cursor:pointer;transition:all .15s;display:flex;
  align-items:center;justify-content:center;}
.pin-btn:hover{background:var(--bg3);border-color:var(--accent);color:var(--accent);}
.pin-btn:active{transform:scale(.92);}
.pin-btn.action{background:transparent;border-color:transparent;color:var(--txt2);font-size:.85rem;}
.pin-btn.action:hover{color:var(--accent);}

/* Main App */
#mainApp{display:none;height:100vh;overflow:hidden;}
.sidebar{width:260px;min-width:260px;background:var(--bg1);border-right:1px solid var(--border);
  display:flex;flex-direction:column;height:100vh;transition:transform .3s;}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 20px;color:var(--txt2);cursor:pointer;
  transition:all .15s;border-left:3px solid transparent;font-size:.92rem;font-weight:500;position:relative;}
.nav-item:hover{color:var(--txt);background:rgba(201,162,39,.05);}
.nav-item.active{color:var(--accent);background:rgba(201,162,39,.08);border-left-color:var(--accent);}
.nav-item .badge{position:absolute;right:16px;background:var(--accent);color:#000;font-size:.7rem;
  font-weight:700;padding:1px 7px;border-radius:99px;min-width:20px;text-align:center;}
.topbar{height:64px;background:var(--bg1);border-bottom:1px solid var(--border);display:flex;align-items:center;
  padding:0 24px;gap:16px;flex-shrink:0;}
.content-area{flex:1;overflow-y:auto;padding:28px;background:var(--bg0);}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:22px;
  transition:all .25s;position:relative;overflow:hidden;}
.stat-card:hover{border-color:rgba(201,162,39,.3);transform:translateY(-2px);}
.stat-card::after{content:'';position:absolute;top:0;right:0;width:80px;height:80px;
  background:radial-gradient(circle,rgba(201,162,39,.06),transparent);border-radius:50%;}
.item-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;
  cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.item-card:hover{border-color:rgba(201,162,39,.3);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3);}
.item-card .star{position:absolute;top:12px;right:12px;cursor:pointer;color:var(--txt2);transition:color .2s;z-index:2;}
.item-card .star.active{color:var(--accent);}
.item-card .thumb{width:100%;height:140px;background:var(--bg3);border-radius:8px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.item-card .thumb img{width:100%;height:100%;object-fit:cover;}
.btn{padding:9px 20px;border-radius:9px;font-weight:600;font-size:.88rem;cursor:pointer;transition:all .15s;
  border:none;display:inline-flex;align-items:center;gap:8px;font-family:'Outfit',sans-serif;}
.btn-primary{background:var(--accent);color:#000;}
.btn-primary:hover{background:var(--accent-l);transform:translateY(-1px);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--txt2);}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-danger{background:rgba(239,68,68,.15);color:var(--err);border:1px solid rgba(239,68,68,.3);}
.btn-danger:hover{background:rgba(239,68,68,.25);}
.btn-sm{padding:6px 14px;font-size:.8rem;}
.input{width:100%;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:9px;
  color:var(--txt);font-family:'Outfit',sans-serif;font-size:.9rem;outline:none;transition:border .2s;}
.input:focus{border-color:var(--accent);}
.input::placeholder{color:var(--txt2);}
textarea.input{resize:vertical;min-height:80px;}
select.input{appearance:none;cursor:pointer;}
.label{font-size:.8rem;font-weight:600;color:var(--txt2);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.5px;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:1000;
  display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--bg1);border:1px solid var(--border);border-radius:16px;width:100%;max-width:520px;
  max-height:85vh;overflow-y:auto;animation:modalIn .25s ease-out;}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-body{padding:24px;}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}

/* Toast */
.toast-container{position:fixed;top:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:10px;}
.toast{padding:14px 20px;border-radius:10px;background:var(--bg2);border:1px solid var(--border);
  font-size:.88rem;display:flex;align-items:center;gap:10px;animation:slideIn .3s ease-out;
  box-shadow:0 8px 32px rgba(0,0,0,.4);min-width:280px;}
.toast.success{border-color:rgba(34,197,94,.4);}.toast.success i{color:var(--ok);}
.toast.error{border-color:rgba(239,68,68,.4);}.toast.error i{color:var(--err);}
.toast.info{border-color:rgba(201,162,39,.4);}.toast.info i{color:var(--accent);}

/* Drop zone */
.drop-zone{border:2px dashed var(--border);border-radius:14px;padding:40px 20px;text-align:center;
  transition:all .2s;cursor:pointer;}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--accent);background:rgba(201,162,39,.04);}

/* Member card */
.member-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px;
  transition:all .2s;position:relative;}
.member-card:hover{border-color:rgba(201,162,39,.3);}
.member-avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:1.1rem;flex-shrink:0;}

/* Activity */
.activity-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.activity-item:last-child{border:none;}
.activity-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;}

/* Preview modal */
.preview-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1500;display:none;align-items:center;
  justify-content:center;cursor:zoom-out;}
.preview-overlay.show{display:flex;}
.preview-overlay img,.preview-overlay iframe{max-width:90vw;max-height:85vh;border-radius:8px;}

/* Animations */
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.animate-fade{animation:fadeIn .4s ease-out;}
.animate-float{animation:float 3s ease-in-out infinite;}

/* Responsive */
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;z-index:500;transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .mobile-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:499;display:none;}
  .mobile-overlay.show{display:block;}
  .content-area{padding:16px;}
  .pin-btn{width:56px;height:56px;font-size:1.1rem;}
}

/* Search highlight */
.search-box{position:relative;}
.search-box i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--txt2);font-size:.85rem;}
.search-box input{padding-left:40px;}

/* Toggle */
.toggle{width:44px;height:24px;background:var(--bg3);border:1px solid var(--border);border-radius:99px;
  cursor:pointer;position:relative;transition:all .2s;}
.toggle.on{background:var(--accent);border-color:var(--accent);}
.toggle::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;
  top:2px;left:2px;transition:all .2s;}
.toggle.on::after{left:22px;}
</style>
</head>
<body>

<!-- Lock Screen -->
<div id="lockScreen">
  <div class="text-center animate-fade">
    <div class="vault-ring mx-auto" id="vaultRing">
      <div class="inner"><i class="fas fa-lock"></i></div>
    </div>
    <h1 class="font-display text-2xl font-700 mb-1" style="color:var(--accent)">LifeOS Vault</h1>
    <p class="text-sm mb-8" style="color:var(--txt2)" id="lockSubtitle">Create your 4-digit PIN</p>
    <div class="flex justify-center gap-4 mb-8" id="pinDots"></div>
    <div class="grid grid-cols-3 gap-3 max-w-[220px] mx-auto" id="pinPad"></div>
    <p class="text-xs mt-6" style="color:var(--txt2)" id="lockHint"></p>
  </div>
</div>

<!-- Main App -->
<div id="mainApp" class="flex">
  <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="p-5 border-b" style="border-color:var(--border)">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,var(--accent),var(--accent-d))">
          <i class="fas fa-shield-halved text-black text-sm"></i>
        </div>
        <div>
          <h2 class="font-display font-700 text-sm" style="color:var(--accent)">LifeOS Vault</h2>
          <p class="text-xs" style="color:var(--txt2)">Personal Secured</p>
        </div>
      </div>
    </div>
    <nav class="flex-1 py-3 overflow-y-auto" id="navList"></nav>
    <div class="p-4 border-t" style="border-color:var(--border)">
      <div class="flex items-center justify-between text-xs mb-3" style="color:var(--txt2)">
        <span>Auto-lock</span>
        <div class="toggle on" id="autoLockToggle" onclick="toggleAutoLock()"></div>
      </div>
      <button class="btn btn-ghost btn-sm w-full justify-center" onclick="lockVault()">
        <i class="fas fa-right-from-bracket"></i> Lock Vault
      </button>
    </div>
  </aside>
  <div class="flex-1 flex flex-col overflow-hidden">
    <div class="topbar">
      <button class="md:hidden text-lg" style="color:var(--txt2)" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
      </button>
      <div class="search-box flex-1 max-w-md">
        <i class="fas fa-search"></i>
        <input class="input" placeholder="Search vault..." id="searchInput" oninput="handleSearch(this.value)">
      </div>
      <div class="flex items-center gap-3 ml-auto">
        <span class="text-xs px-3 py-1 rounded-full" style="background:rgba(201,162,39,.1);color:var(--accent)" id="itemCount">0 items</span>
        <button class="w-9 h-9 rounded-lg flex items-center justify-center transition-colors" style="background:var(--bg2);color:var(--txt2)" onclick="lockVault()" title="Lock">
          <i class="fas fa-lock text-sm"></i>
        </button>
      </div>
    </div>
    <div class="content-area" id="contentArea"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<!-- Preview -->
<div class="preview-overlay" id="previewOverlay" onclick="closePreview()">
  <div id="previewContent" onclick="event.stopPropagation()"></div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script>
/* ===== STATE ===== */
const STORAGE_KEY = 'lifeos_vault_data';
let state = {
  pin: null,
  items: [],
  members: [],
  activity: [],
  settings: { autoLock: true, autoLockMin: 5 },
  currentSection: 'dashboard',
  searchQuery: '',
  pinBuffer: '',
  pinPhase: 'setup', // setup | confirm | unlock
  tempPin: '',
  autoLockTimer: null
};

/* ===== NAV CONFIG ===== */
const navItems = [
  { id:'dashboard', icon:'fa-grid-2', label:'Dashboard' },
  { id:'documents', icon:'fa-file-lines', label:'Documents' },
  { id:'images', icon:'fa-image', label:'Images' },
  { id:'files', icon:'fa-folder-open', label:'Files' },
  { id:'notes', icon:'fa-note-sticky', label:'Notes' },
  { id:'cards', icon:'fa-credit-card', label:'Cards & IDs' },
  { id:'members', icon:'fa-user-shield', label:'Trusted Contacts' },
  { id:'activity', icon:'fa-clock-rotate-left', label:'Activity Log' },
  { id:'settings', icon:'fa-gear', label:'Settings' }
];

/* ===== PERSISTENCE ===== */
function saveState(){
  const s = {...state};
  delete s.pinBuffer; delete s.pinPhase; delete s.tempPin;
  delete s.currentSection; delete s.searchQuery; delete s.autoLockTimer;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
}
function loadState(){
  try{
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(d){ state.pin=d.pin; state.items=d.items||[]; state.members=d.members||[];
      state.activity=d.activity||[]; state.settings={...state.settings,...(d.settings||{})}; }
  }catch(e){}
}

/* ===== TOAST ===== */
function toast(msg, type='info'){
  const icons={success:'fa-circle-check',error:'fa-circle-xmark',info:'fa-circle-info'};
  const el=document.createElement('div');
  el.className=`toast ${type}`;
  el.innerHTML=`<i class="fas ${icons[type]}"></i><span>${msg}</span>`;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(40px)';el.style.transition='all .3s';
    setTimeout(()=>el.remove(),300);},3000);
}

/* ===== ACTIVITY ===== */
function logActivity(action, detail=''){
  state.activity.unshift({action,detail,time:Date.now()});
  if(state.activity.length>200) state.activity.length=200;
  saveState();
}

/* ===== ID GENERATOR ===== */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}

/* ===== LOCK SCREEN ===== */
function initLockScreen(){
  const dots=document.getElementById('pinDots');
  dots.innerHTML='';
  for(let i=0;i<4;i++){const d=document.createElement('div');d.className='pin-dot';dots.appendChild(d);}
  const pad=document.getElementById('pinPad');
  pad.innerHTML='';
  for(let i=1;i<=9;i++){
    const b=document.createElement('button');b.className='pin-btn';b.textContent=i;
    b.onclick=()=>enterPin(i);pad.appendChild(b);
  }
  const empty=document.createElement('div');
  const del=document.createElement('button');del.className='pin-btn action';del.innerHTML='<i class="fas fa-delete-left"></i>';
  del.onclick=()=>deletePin();pad.appendChild(empty);pad.appendChild(del);pad.appendChild(empty);
  if(!state.pin){
    state.pinPhase='setup';state.pinBuffer='';state.tempPin='';
    document.getElementById('lockSubtitle').textContent='Create your 4-digit PIN';
    document.getElementById('lockHint').textContent='';
  } else {
    state.pinPhase='unlock';state.pinBuffer='';
    document.getElementById('lockSubtitle').textContent='Enter your PIN to unlock';
    document.getElementById('lockHint').textContent='';
  }
  updatePinDots();
}
function enterPin(n){
  if(state.pinBuffer.length>=4) return;
  state.pinBuffer+=n;
  updatePinDots();
  if(state.pinBuffer.length===4) setTimeout(processPin,200);
}
function deletePin(){
  state.pinBuffer=state.pinBuffer.slice(0,-1);
  updatePinDots();
}
function updatePinDots(){
  const dots=document.getElementById('pinDots').children;
  for(let i=0;i<4;i++) dots[i].className='pin-dot'+(i<state.pinBuffer.length?' filled':'');
}
function processPin(){
  if(state.pinPhase==='setup'){
    state.tempPin=state.pinBuffer;state.pinBuffer='';state.pinPhase='confirm';
    document.getElementById('lockSubtitle').textContent='Confirm your PIN';
    updatePinDots();
  } else if(state.pinPhase==='confirm'){
    if(state.pinBuffer===state.tempPin){
      state.pin=state.pinBuffer;saveState();
      document.getElementById('vaultRing').classList.add('unlocked');
      document.getElementById('lockSubtitle').textContent='Vault Unlocked';
      document.getElementById('lockHint').textContent='';
      setTimeout(showApp,600);
    } else {
      const dots=document.getElementById('pinDots').children;
      for(let i=0;i<4;i++) dots[i].classList.add('error');
      document.getElementById('lockHint').textContent='PINs did not match. Try again.';
      state.pinBuffer='';state.pinPhase='setup';state.tempPin='';
      document.getElementById('lockSubtitle').textContent='Create your 4-digit PIN';
      setTimeout(updatePinDots,400);
    }
  } else if(state.pinPhase==='unlock'){
    if(state.pinBuffer===state.pin){
      document.getElementById('vaultRing').classList.add('unlocked');
      document.getElementById('lockSubtitle').textContent='Vault Unlocked';
      setTimeout(showApp,600);
      logActivity('Vault Unlocked','');
    } else {
      const dots=document.getElementById('pinDots').children;
      for(let i=0;i<4;i++) dots[i].classList.add('error');
      document.getElementById('lockHint').textContent='Incorrect PIN';
      state.pinBuffer='';
      setTimeout(updatePinDots,400);
    }
  }
}

/* ===== SHOW APP ===== */
function showApp(){
  document.getElementById('lockScreen').style.display='none';
  document.getElementById('mainApp').style.display='flex';
  renderNav();navigateTo('dashboard');startAutoLock();
}
function lockVault(){
  clearTimeout(state.autoLockTimer);
  document.getElementById('mainApp').style.display='none';
  document.getElementById('lockScreen').style.display='flex';
  document.getElementById('vaultRing').classList.remove('unlocked');
  initLockScreen();
}

/* ===== AUTO LOCK ===== */
function startAutoLock(){
  clearTimeout(state.autoLockTimer);
  if(state.settings.autoLock){
    state.autoLockTimer=setTimeout(()=>{lockVault();toast('Vault auto-locked','info');},state.settings.autoLockMin*60*1000);
  }
}
function resetAutoLock(){if(state.settings.autoLock) startAutoLock();}
function toggleAutoLock(){
  state.settings.autoLock=!state.settings.autoLock;
  document.getElementById('autoLockToggle').className='toggle'+(state.settings.autoLock?' on':'');
  if(state.settings.autoLock) startAutoLock(); else clearTimeout(state.autoLockTimer);
  saveState();toast(state.settings.autoLock?'Auto-lock enabled':'Auto-lock disabled','info');
}

/* ===== NAV ===== */
function renderNav(){
  const nav=document.getElementById('navList');
  nav.innerHTML=navItems.map(n=>{
    let badge='';
    if(n.id==='documents') badge=countItems('document');
    if(n.id==='images') badge=countItems('image');
    if(n.id==='files') badge=countItems('file');
    if(n.id==='notes') badge=countItems('note');
    if(n.id==='cards') badge=countItems('card');
    if(n.id==='members') badge=state.members.length;
    if(n.id==='activity') badge=state.activity.length;
    return `<div class="nav-item${state.currentSection===n.id?' active':''}" onclick="navigateTo('${n.id}')">
      <i class="fas ${n.icon} w-5 text-center"></i><span>${n.label}</span>${badge?`<span class="badge">${badge}</span>`:''}
    </div>`;
  }).join('');
  document.getElementById('itemCount').textContent=state.items.length+' items';
  document.getElementById('autoLockToggle').className='toggle'+(state.settings.autoLock?' on':'');
}
function countItems(type){return state.items.filter(i=>i.type===type).length;}
function navigateTo(id){
  state.currentSection=id;state.searchQuery='';
  document.getElementById('searchInput').value='';
  renderNav();renderContent();toggleSidebar(false);
}

/* ===== SIDEBAR TOGGLE ===== */
function toggleSidebar(force){
  const sb=document.getElementById('sidebar');
  const ov=document.getElementById('mobileOverlay');
  const open=force!==undefined?force:!sb.classList.contains('open');
  sb.classList.toggle('open',open);ov.classList.toggle('show',open);
}

/* ===== SEARCH ===== */
function handleSearch(q){
  state.searchQuery=q.toLowerCase().trim();
  renderContent();
}

/* ===== RENDER CONTENT ===== */
function renderContent(){
  const area=document.getElementById('contentArea');
  let items=state.items;
  if(state.searchQuery){
    items=items.filter(i=>(i.name||'').toLowerCase().includes(state.searchQuery)||
      (i.category||'').toLowerCase().includes(state.searchQuery)||
      (i.note||'').toLowerCase().includes(state.searchQuery)||
      (i.tags||[]).some(t=>t.toLowerCase().includes(state.searchQuery)));
  }
  switch(state.currentSection){
    case 'dashboard': area.innerHTML=renderDashboard(items);break;
    case 'documents': area.innerHTML=renderItemsSection('document','Documents','fa-file-lines',items,'application/pdf,.doc,.docx,.txt,.xls,.xlsx,.ppt,.pptx');break;
    case 'images': area.innerHTML=renderItemsSection('image','Images','fa-image',items,'image/*');break;
    case 'files': area.innerHTML=renderItemsSection('file','Files','fa-folder-open',items,'*/*');break;
    case 'notes': area.innerHTML=renderNotesSection(items);break;
    case 'cards': area.innerHTML=renderCardsSection(items);break;
    case 'members': area.innerHTML=renderMembersSection();break;
    case 'activity': area.innerHTML=renderActivitySection();break;
    case 'settings': area.innerHTML=renderSettingsSection();break;
  }
  area.scrollTop=0;
}

/* ===== DASHBOARD ===== */
function renderDashboard(items){
  const docs=countItems('document'),imgs=countItems('image'),files=countItems('file'),
    notes=countItems('note'),cards=countItems('card');
  const starred=items.filter(i=>i.starred);
  const recent=state.items.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,6);
  const totalSize=state.items.reduce((s,i)=>s+(i.size||0),0);
  return `<div class="animate-fade">
    <div class="mb-8">
      <h1 class="font-display text-3xl font-700 mb-1">Welcome back</h1>
      <p style="color:var(--txt2)">Your personal vault is secure with ${state.items.length} items stored.</p>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 mb-8">
      ${statCard('Documents',docs,'fa-file-lines','#3b82f6')}
      ${statCard('Images',imgs,'fa-image','#a855f7')}
      ${statCard('Files',files,'fa-folder-open','#f59e0b')}
      ${statCard('Notes',notes,'fa-note-sticky','#22c55e')}
      ${statCard('Cards',cards,'fa-credit-card','#ef4444')}
    </div>
    <div class="grid md:grid-cols-3 gap-6">
      <div class="md:col-span-2">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-600 text-lg">Recent Items</h2>
          ${state.searchQuery?'<span style="color:var(--txt2)" class="text-sm">'+items.length+' results</span>':''}
        </div>
        ${recent.length?`<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">${recent.map(itemCard).join('')}</div>`
          :'<div class="text-center py-16" style="color:var(--txt2)"><i class="fas fa-vault text-4xl mb-3 block" style="color:var(--border)"></i>Your vault is empty. Start adding items.</div>'}
      </div>
      <div>
        <h2 class="font-600 text-lg mb-4">Quick Stats</h2>
        <div class="space-y-3">
          <div class="stat-card"><div class="flex items-center gap-3 mb-1"><i class="fas fa-star" style="color:var(--accent)"></i><span class="text-sm">Starred</span></div><span class="text-2xl font-700">${starred.length}</span></div>
          <div class="stat-card"><div class="flex items-center gap-3 mb-1"><i class="fas fa-database" style="color:var(--accent)"></i><span class="text-sm">Storage Used</span></div><span class="text-2xl font-700">${formatSize(totalSize)}</span></div>
          <div class="stat-card"><div class="flex items-center gap-3 mb-1"><i class="fas fa-user-shield" style="color:var(--accent)"></i><span class="text-sm">Trusted Contacts</span></div><span class="text-2xl font-700">${state.members.length}</span></div>
        </div>
        <h2 class="font-600 text-lg mt-6 mb-4">Quick Add</h2>
        <div class="space-y-2">
          <button class="btn btn-ghost btn-sm w-full justify-start" onclick="navigateTo('documents');setTimeout(()=>openAddModal('document'),100)"><i class="fas fa-plus"></i> Document</button>
          <button class="btn btn-ghost btn-sm w-full justify-start" onclick="navigateTo('images');setTimeout(()=>openAddModal('image'),100)"><i class="fas fa-plus"></i> Image</button>
          <button class="btn btn-ghost btn-sm w-full justify-start" onclick="navigateTo('notes');setTimeout(()=>openAddModal('note'),100)"><i class="fas fa-plus"></i> Note</button>
          <button class="btn btn-ghost btn-sm w-full justify-start" onclick="navigateTo('cards');setTimeout(()=>openAddModal('card'),100)"><i class="fas fa-plus"></i> Card / ID</button>
        </div>
      </div>
    </div>
  </div>`;
}
function statCard(label,count,icon,color){
  return `<div class="stat-card">
    <i class="fas ${icon} text-lg mb-3" style="color:${color}"></i>
    <div class="text-2xl font-800">${count}</div>
    <div class="text-xs mt-1" style="color:var(--txt2)">${label}</div>
  </div>`;
}

/* ===== ITEMS SECTION (docs, images, files) ===== */
function renderItemsSection(type,title,icon,filtered,accept){
  const items=filtered.filter(i=>i.type===type);
  return `<div class="animate-fade">
    <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
      <div><h1 class="font-display text-2xl font-700">${title}</h1>
        <p class="text-sm" style="color:var(--txt2)">${items.length} item${items.length!==1?'s':''} stored</p></div>
      <button class="btn btn-primary" onclick="openAddModal('${type}')"><i class="fas fa-plus"></i> Add ${title.slice(0,-1)}</button>
    </div>
    <div class="drop-zone mb-6" id="dropZone" onclick="document.getElementById('fileInput').click()"
      ondragover="event.preventDefault();this.classList.add('dragover')"
      ondragleave="this.classList.remove('dragover')"
      ondrop="event.preventDefault();this.classList.remove('dragover');handleDrop(event,'${type}')">
      <i class="fas fa-cloud-arrow-up text-3xl mb-3" style="color:var(--txt2)"></i>
      <p style="color:var(--txt2)">Drag & drop files here or click to browse</p>
      <input type="file" id="fileInput" hidden multiple accept="${accept}" onchange="handleFileSelect(event,'${type}')">
    </div>
    ${items.length?`<div class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">${items.map(itemCard).join('')}</div>`
      :`<div class="text-center py-16" style="color:var(--txt2)"><i class="fas ${icon} text-4xl mb-3 block" style="color:var(--border)"></i>No ${title.toLowerCase()} yet</div>`}
  </div>`;
}

/* ===== ITEM CARD ===== */
function itemCard(item){
  const typeIcons={document:'fa-file-lines',image:'fa-image',file:'fa-folder-open',note:'fa-note-sticky',card:'fa-credit-card'};
  const typeColors={document:'#3b82f6',image:'#a855f7',file:'#f59e0b',note:'#22c55e',card:'#ef4444'};
  let thumb='';
  if(item.type==='image'&&item.data){
    thumb=`<div class="thumb" onclick="previewImage('${item.id}')"><img src="${item.data}" alt="${esc(item.name)}" loading="lazy"></div>`;
  } else {
    thumb=`<div class="thumb"><i class="fas ${typeIcons[item.type]} text-3xl" style="color:${typeColors[item.type]}"></i></div>`;
  }
  return `<div class="item-card" ondblclick="${item.type==='image'?`previewImage('${item.id}')`:item.type==='document'?`previewDoc('${item.id}')`:`openEditModal('${item.id}')`}">
    <span class="star${item.starred?' active':''}" onclick="event.stopPropagation();toggleStar('${item.id}')"><i class="fas fa-star"></i></span>
    ${thumb}
    <h3 class="font-600 text-sm mb-1 truncate pr-6">${esc(item.name)}</h3>
    <div class="flex items-center justify-between">
      <span class="text-xs" style="color:var(--txt2)">${formatSize(item.size||0)} · ${timeAgo(item.createdAt)}</span>
      <div class="flex gap-1">
        <button class="w-7 h-7 rounded flex items-center justify-center text-xs transition-colors" style="color:var(--txt2)" 
          onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--txt2)'"
          onclick="event.stopPropagation();openEditModal('${item.id}')"><i class="fas fa-pen"></i></button>
        <button class="w-7 h-7 rounded flex items-center justify-center text-xs transition-colors" style="color:var(--txt2)"
          onmouseover="this.style.color='var(--err)'" onmouseout="this.style.color='var(--txt2)'"
          onclick="event.stopPropagation();deleteItem('${item.id}')"><i class="fas fa-trash"></i></button>
      </div>
    </div>
    ${item.tags&&item.tags.length?`<div class="flex flex-wrap gap-1 mt-2">${item.tags.map(t=>`<span class="text-xs px-2 py-0.5 rounded-full" style="background:var(--bg3);color:var(--txt2)">${esc(t)}</span>`).join('')}</div>`:''}
  </div>`;
}

/* ===== CARDS SECTION ===== */
function renderCardsSection(filtered){
  const items=filtered.filter(i=>i.type==='card');
  const cardIcons={credit:'fa-credit-card',debit:'fa-credit-card',id:'fa-id-card',passport:'fa-passport',insurance:'fa-shield-heart',other:'fa-card'};
  const cardColors={credit:'#3b82f6',debit:'#22c55e',id:'#f59e0b',passport:'#a855f7',insurance:'#ef4444',other:'#6b7280'};
  return `<div class="animate-fade">
    <div class="flex items-center justify-between mb-6">
      <div><h1 class="font-display text-2xl font-700">Cards & IDs</h1>
        <p class="text-sm" style="color:var(--txt2)">${items.length} card${items.length!==1?'s':''}</p></div>
      <button class="btn btn-primary" onclick="openAddModal('card')"><i class="fas fa-plus"></i> Add Card</button>
    </div>
    ${items.length?`<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">${items.map(c=>{
      const ct=c.cardType||'other';
      return `<div class="item-card" onclick="openEditModal('${c.id}')">
        <span class="star${c.starred?' active':''}" onclick="event.stopPropagation();toggleStar('${c.id}')"><i class="fas fa-star"></i></span>
        <div class="flex items-center gap-3 mb-3">
          <div class="w-12 h-12 rounded-xl flex items-center justify-center" style="background:${cardColors[ct]}22">
            <i class="fas ${cardIcons[ct]} text-lg" style="color:${cardColors[ct]}"></i>
          </div>
          <div>
            <h3 class="font-600 text-sm">${esc(c.name)}</h3>
            <span class="text-xs capitalize" style="color:var(--txt2)">${ct}</span>
          </div>
        </div>
        ${c.number?`<p class="text-sm font-mono mb-2" style="color:var(--txt2)">${maskNumber(c.number)}</p>`:''}
        ${c.holder?`<p class="text-xs" style="color:var(--txt2)">${esc(c.holder)}</p>`:''}
        <div class="flex items-center justify-between mt-3">
          <span class="text-xs" style="color:var(--txt2)">${timeAgo(c.createdAt)}</span>
          <div class="flex gap-1">
            <button class="w-7 h-7 rounded flex items-center justify-center text-xs" style="color:var(--txt2)"
              onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--txt2)'"
              onclick="event.stopPropagation();openEditModal('${c.id}')"><i class="fas fa-pen"></i></button>
            <button class="w-7 h-7 rounded flex items-center justify-center text-xs" style="color:var(--txt2)"
              onmouseover="this.style.color='var(--err)'" onmouseout="this.style.color='var(--txt2)'"
              onclick="event.stopPropagation();deleteItem('${c.id}')"><i class="fas fa-trash"></i></button>
          </div>
        </div>
      </div>`;
    }).join('')}</div>`
      :'<div class="text-center py-16" style="color:var(--txt2)"><i class="fas fa-credit-card text-4xl mb-3 block" style="color:var(--border)"></i>No cards stored</div>'}
  </div>`;
}
function maskNumber(n){if(!n||n.length<8) return n;return '•'.repeat(n.length-4)+n.slice(-4);}

  return `<div class="animate-fade">
    <div class="flex items-center justify-between mb-6">
      <div><h1 class="font-display text-2xl font-700">Activity Log</h1>
        <p class="text-sm" style="color:var(--txt2)">${state.activity.length} event${state.activity.length!==1?'s':''}</p></div>
      ${state.activity.length?`<button class="btn btn-ghost btn-sm" onclick="clearActivity()"><i class="fas fa-trash"></i> Clear All</button>`:''}
    </div>
    ${state.activity.length?`<div class="space-y-0" style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:4px 20px">${state.activity.map(a=>{
      const color=actColors[a.action]||'var(--txt2)';
      return `<div class="activity-item"><div class="activity-dot" style="background:${color}"></div>

/* ===== FILE HANDLING ===== */
function handleDrop(e,type){
  const files=e.dataTransfer.files;
  for(let f of files) readFile(f,type);
}
function handleFileSelect(e,type){
  const files=e.target.files;
  for(let f of files) readFile(f,type);
  e.target.value='';
}
function readFile(file,type){
  if(type==='image'&&!file.type.startsWith('image/')){toast('Please select an image file','error');return;}
  const reader=new FileReader();
  reader.onload=function(e){
    const item={id:uid(),type,name:file.name,size:file.size,data:e.target.result,
      mimeType:file.type,category:'',tags:[],starred:false,createdAt:Date.now()};
    state.items.push(item);saveState();
    logActivity('added',`${type}: ${file.name}`);
    toast(`Added: ${file.name}`,'success');renderContent();renderNav();
  };
  reader.readAsDataURL(file);
}

/* ===== ITEM CRUD ===== */
function toggleStar(id){
  const item=state.items.find(i=>i.id===id);
  if(item){item.starred=!item.starred;saveState();renderContent();}
}
function deleteItem(id){
  const item=state.items.find(i=>i.id===id);
  if(!item) return;
  openConfirmModal(`Delete "${item.name}"?`,`This will permanently remove this item from your vault.`,()=>{
    state.items=state.items.filter(i=>i.id!==id);saveState();
    logActivity('deleted',item.name);toast('Item deleted','success');renderContent();renderNav();
  });
}

/* ===== ADD/EDIT MODALS ===== */
function openAddModal(type){
  if(type==='note') openNoteModal();

}
function openEditModal(id){

/* ===== EXPORT ===== */
function exportData(withFiles){
  const data={version:1,exportedAt:Date.now(),
    items:state.items.map(i=>withFiles?i:{...i,data:null,size:0}),
    members:state.members,settings:state.settings};
  if(withFiles){
    toast('Preparing export with files...','info');
    setTimeout(()=>{
      try{
        const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
        downloadBlob(blob,`lifeos-vault-export-${new Date().toISOString().slice(0,10)}.json`);
        logActivity('exported','Full export with files');toast('Export complete','success');
      }catch(e){toast('Export failed: file too large. Try exporting without files.','error');}
    },100);
  } else {
    const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
    downloadBlob(blob,`lifeos-vault-export-${new Date().toISOString().slice(0,10)}.json`);
    logActivity('exported','Export without files');toast('Export complete','success');
  }
}
function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* ===== IMPORT ===== */
function importData(mode){
  const inp=document.getElementById('importFile');
  inp.dataset.mode=mode;inp.click();
}
function processImport(e){
  const mode=e.target.dataset.mode||'replace';
  const file=e.target.files[0];
  if(!file) return;
  e.target.value='';
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const data=JSON.parse(ev.target.result);
      if(!data.items||!Array.isArray(data.items)){toast('Invalid vault file','error');return;}
      if(mode==='replace'){
        state.items=data.items;state.members=data.members||[];
        if(data.settings) state.settings={...state.settings,...data.settings};
      } else {
        // Merge - add items that don't exist by id
        const existingIds=new Set(state.items.map(i=>i.id));
        data.items.forEach(i=>{if(!existingIds.has(i.id)) state.items.push(i);});
        const existingMemIds=new Set(state.members.map(m=>m.id));
        (data.members||[]).forEach(m=>{if(!existingMemIds.has(m.id)) state.members.push(m);});
      }
      saveState();logActivity('imported',`${mode==='replace'?'Replaced':'Merged'} data from ${file.name}`);
      toast(`Data ${mode==='replace'?'replaced':'merged'} successfully`,'success');
      renderContent();renderNav();
    }catch(err){toast('Failed to parse file: '+err.message,'error');}
  };
  reader.readAsText(file);
}

/* ===== WIPE ===== */
function confirmWipe(){
  openConfirmModal('Wipe All Vault Data?','This will permanently delete ALL items, contacts, and activity. Your PIN will also be reset. This cannot be undone.',()=>{
    localStorage.removeItem(STORAGE_KEY);
    state={pin:null,items:[],members:[],activity:[],settings:{autoLock:true,autoLockMin:5},
      currentSection:'dashboard',searchQuery:'',pinBuffer:'',pinPhase:'setup',tempPin:'',autoLockTimer:null};
    document.getElementById('mainApp').style.display='none';
    document.getElementById('lockScreen').style.display='flex';
    document.getElementById('vaultRing').classList.remove('unlocked');
    initLockScreen();toast('All data wiped','info');
  });
}

/* ===== UTILITIES ===== */
function esc(s){if(!s)return '';const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function formatSize(bytes){if(!bytes)return '0 B';const k=1024;const sizes=['B','KB','MB','GB'];
  const i=Math.floor(Math.log(bytes)/Math.log(k));return parseFloat((bytes/Math.pow(k,i)).toFixed(1))+' '+sizes[i];}
function timeAgo(ts){if(!ts)return '';const s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';if(s<2592000)return Math.floor(s/86400)+'d ago';
  return new Date(ts).toLocaleDateString();}

/* ===== KEYBOARD SUPPORT ===== */
document.addEventListener('keydown',e=>{
  // PIN entry via keyboard
  if(document.getElementById('lockScreen').style.display!=='none'){
    if(e.key>='0'&&e.key<='9') enterPin(parseInt(e.key));
    else if(e.key==='Backspace') deletePin();
    else if(e.key==='Enter'&&state.pinBuffer.length===4) processPin();
  }
  // Close modals with Escape
  if(e.key==='Escape'){closeModal();closePreview();}
  // Lock with Ctrl+L
  if(e.ctrlKey&&e.key==='l'){e.preventDefault();lockVault();}
});

// Reset auto-lock on user interaction
['click','keydown','mousemove','scroll','touchstart'].forEach(ev=>{
  document.addEventListener(ev,resetAutoLock,{passive:true});
});

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('modalOverlay')) closeModal();
});

/* ===== INIT ===== */
loadState();
initLockScreen();
</script>
