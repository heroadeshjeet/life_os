<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Life OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  /* Disable text selection across the entire page */
  body {
    -webkit-user-select: none; /* Safari */
    -ms-user-select: none;     /* IE 10 and Edge */
    user-select: none;         /* Standard syntax */
  }

  /* Prevent link dragging visual behavior */
  a, img {
    -webkit-user-drag: none;
    user-drag: none;
  }
</style>

<script>
  // 1. Disable Right-Click (Context Menu)
  document.addEventListener('contextmenu', (event) => {
    event.preventDefault();
  });

  // 2. Disable Link and Image Dragging
  document.addEventListener('dragstart', (event) => {
    if (event.target.tagName === 'A' || event.target.tagName === 'IMG') {
      event.preventDefault();
    }
  });

  // 3. Disable DevTools Shortcuts (F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U)
  document.addEventListener('keydown', (event) => {
    // Prevent F12
    if (event.key === 'F12') {
      event.preventDefault();
    }
    
    // Prevent Ctrl+Shift+I (Inspect element) and Ctrl+Shift+J (Console)
    if (event.ctrlKey && event.shiftKey && (event.key === 'I' || event.key === 'i' || event.key === 'J' || event.key === 'j')) {
      event.preventDefault();
    }

    // Prevent Ctrl+U (View Source)
    if (event.ctrlKey && (event.key === 'U' || event.key === 'u')) {
      event.preventDefault();
    }
  });
</script>
</main>
<style>
  :root {
    --sky-top: #3AA8E0;
    --sky-mid: #7ECEF4;
    --sky-low: #B8E4FA;
    --sky-bottom: #E3F4FC;
    --glass-bg: rgba(255,255,255,0.22);
    --glass-border: rgba(255,255,255,0.45);
    --glass-shadow: rgba(0,60,120,0.12);
    --text-primary: #0A3D6B;
    --text-secondary: #2B6DA0;
    --text-muted: #5A9CC5;
    --glow-cyan: rgba(0,200,220,0.45);
    --glow-soft: rgba(100,200,255,0.2);
    --dock-bg: rgba(255,255,255,0.18);
    --radius: 18px;
    --radius-sm: 12px;
  }
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; overflow:hidden;
    font-family:'Nunito',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body {
    background: linear-gradient(175deg, var(--sky-top) 0%, var(--sky-mid) 30%, var(--sky-low) 60%, var(--sky-bottom) 100%);
    position:relative;
  }

  /* === SUN === */
  .sun {
    position:absolute; top:-60px; right:40px;
    width:200px; height:200px; border-radius:50%;
    background: radial-gradient(circle, #FFF9C4 0%, #FFE082 30%, #FFB300 60%, transparent 72%);
    box-shadow: 0 0 80px 30px rgba(255,200,50,0.35), 0 0 160px 80px rgba(255,180,0,0.15);
    animation: sunPulse 6s ease-in-out infinite;
    z-index:0;
  }
  .sun::after {
    content:''; position:absolute; inset:-60px; border-radius:50%;
    background: conic-gradient(from 0deg, transparent 0deg, rgba(255,230,100,0.08) 10deg, transparent 20deg,
      transparent 30deg, rgba(255,230,100,0.06) 40deg, transparent 50deg,
      transparent 60deg, rgba(255,230,100,0.08) 70deg, transparent 80deg,
      transparent 90deg, rgba(255,230,100,0.06) 100deg, transparent 110deg,
      transparent 120deg, rgba(255,230,100,0.08) 130deg, transparent 140deg,
      transparent 150deg, rgba(255,230,100,0.06) 160deg, transparent 170deg,
      transparent 180deg, rgba(255,230,100,0.08) 190deg, transparent 200deg,
      transparent 210deg, rgba(255,230,100,0.06) 220deg, transparent 230deg,
      transparent 240deg, rgba(255,230,100,0.08) 250deg, transparent 260deg,
      transparent 270deg, rgba(255,230,100,0.06) 280deg, transparent 290deg,
      transparent 300deg, rgba(255,230,100,0.08) 310deg, transparent 320deg,
      transparent 330deg, rgba(255,230,100,0.06) 340deg, transparent 360deg);
    animation: sunRaysSpin 40s linear infinite;
  }
  @keyframes sunPulse {
    0%,100% { transform:scale(1); opacity:1; }
    50% { transform:scale(1.05); opacity:0.92; }
  }
  @keyframes sunRaysSpin { to { transform:rotate(360deg); } }

  /* === CLOUDS === */
  .cloud {
    position:absolute; border-radius:60px;
    background: rgba(255,255,255,0.92);
    filter: blur(0.5px);
    z-index:1;
  }
  .cloud::before, .cloud::after {
    content:''; position:absolute; background:inherit; border-radius:50%;
  }
  .cloud-1 { width:180px; height:50px; top:60px; animation: drift 50s linear infinite; }
  .cloud-1::before { width:70px; height:70px; top:-30px; left:30px; }
  .cloud-1::after { width:90px; height:55px; top:-20px; left:80px; }
  .cloud-2 { width:140px; height:40px; top:130px; animation: drift 65s linear infinite; animation-delay:-20s; opacity:0.8; }
  .cloud-2::before { width:55px; height:55px; top:-25px; left:20px; }
  .cloud-2::after { width:70px; height:45px; top:-18px; left:60px; }
  .cloud-3 { width:200px; height:55px; top:40px; animation: drift 55s linear infinite; animation-delay:-35s; opacity:0.7; }
  .cloud-3::before { width:80px; height:80px; top:-35px; left:35px; }
  .cloud-3::after { width:100px; height:60px; top:-25px; left:90px; }
  .cloud-4 { width:120px; height:35px; top:180px; animation: drift 70s linear infinite; animation-delay:-45s; opacity:0.6; }
  .cloud-4::before { width:45px; height:45px; top:-20px; left:15px; }
  .cloud-4::after { width:60px; height:38px; top:-14px; left:50px; }
  .cloud-5 { width:160px; height:45px; top:100px; animation: drift 60s linear infinite; animation-delay:-10s; opacity:0.75; }
  .cloud-5::before { width:65px; height:65px; top:-28px; left:25px; }
  .cloud-5::after { width:80px; height:50px; top:-20px; left:70px; }
  @keyframes drift {
    from { left: -280px; }
    to { left: calc(100vw + 80px); }
  }

  /* === BUBBLES === */
  .bubble {
    position:absolute; border-radius:50%; z-index:1;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.15) 35%, rgba(150,220,255,0.08) 65%, transparent 80%);
    border: 1px solid rgba(255,255,255,0.35);
    box-shadow: inset 0 -4px 8px rgba(100,200,255,0.1), 0 2px 8px rgba(0,80,140,0.06);
    pointer-events:none;
    animation: bubbleRise linear forwards;
  }
  @keyframes bubbleRise {
    0% { transform: translateY(0) scale(0.3); opacity:0; }
    8% { opacity:0.7; transform: translateY(-8vh) scale(1); }
    85% { opacity:0.5; }
    100% { transform: translateY(-110vh) scale(0.8); opacity:0; }
  }

  /* === LAUNCHER CONTAINER === */
  .launcher {
    position:relative; z-index:10;
    max-width:460px; margin:0 auto; height:100vh;
    display:flex; flex-direction:column;
    padding: 20px 20px 0;
    overflow-y:auto; overflow-x:hidden;
    scrollbar-width:none;
  }
  .launcher::-webkit-scrollbar { display:none; }

  /* === STATUS BAR === */
  .status-bar {
    display:flex; justify-content:space-between; align-items:center;
    padding:4px 4px 12px; font-size:12px; font-weight:700;
    color: var(--text-primary); opacity:0.85;
  }
  .status-icons { display:flex; gap:8px; font-size:13px; }

  /* === CLOCK WIDGET === */
  .clock-widget {
    background: var(--glass-bg);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    padding: 24px 28px 20px;
    text-align:center;
    box-shadow: 0 8px 32px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.5);
    position:relative; overflow:hidden;
    animation: fadeSlideDown 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .clock-widget::before {
    content:''; position:absolute; top:0; left:0; right:0; height:50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, transparent 100%);
    pointer-events:none; border-radius: var(--radius) var(--radius) 0 0;
  }
  .clock-glow {
    position:absolute; top:50%; left:50%; width:200px; height:200px;
    transform:translate(-50%,-50%); border-radius:50%;
    background: radial-gradient(circle, var(--glow-cyan) 0%, transparent 70%);
    opacity:0.3; animation: glowPulse 4s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes glowPulse {
    0%,100% { opacity:0.25; transform:translate(-50%,-50%) scale(1); }
    50% { opacity:0.4; transform:translate(-50%,-50%) scale(1.15); }
  }
  .greeting { font-size:15px; font-weight:600; color:var(--text-secondary); margin-bottom:4px; position:relative; }
  .clock-time {
    font-size:56px; font-weight:900; letter-spacing:-2px; line-height:1;
    color:var(--text-primary); position:relative;
    text-shadow: 0 2px 12px rgba(0,100,180,0.12);
  }
  .clock-time .seconds { font-size:24px; font-weight:600; color:var(--text-muted); vertical-align:super; margin-left:2px; }
  .clock-date { font-size:14px; font-weight:600; color:var(--text-secondary); margin-top:6px; position:relative; }
  .clock-weather {
    display:inline-flex; align-items:center; gap:6px;
    margin-top:8px; padding:5px 14px;
    background: rgba(255,255,255,0.25); border-radius:20px;
    font-size:13px; font-weight:600; color:var(--text-secondary);
    position:relative;
  }
  .clock-weather i { color:#FFB300; font-size:15px; }

  /* === SEARCH BAR === */
  .search-wrap {
    margin-top:16px; position:relative;
    animation: fadeSlideDown 0.7s cubic-bezier(0.34,1.56,0.64,1) 0.1s both;
  }
  .search-bar {
    width:100%; padding:13px 18px 13px 44px;
    background: var(--glass-bg);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-sm);
    font-family:inherit; font-size:15px; font-weight:500;
    color:var(--text-primary); outline:none;
    box-shadow: 0 4px 16px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.4);
    transition: box-shadow 0.4s ease, border-color 0.4s ease;
  }
  .search-bar::placeholder { color: var(--text-muted); }
  .search-bar:focus {
    border-color: rgba(100,210,255,0.6);
    box-shadow: 0 4px 16px var(--glass-shadow), 0 0 20px var(--glow-cyan), 0 0 40px var(--glow-soft), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .search-icon {
    position:absolute; left:16px; top:50%; transform:translateY(-50%);
    color:var(--text-muted); font-size:15px; pointer-events:none;
    transition: color 0.3s ease;
  }
  .search-bar:focus ~ .search-icon { color: var(--text-secondary); }

  /* === APP GRID === */
  .app-grid {
    display:grid; grid-template-columns: repeat(4,1fr);
    gap:16px 12px; padding:20px 4px;
    animation: fadeSlideDown 0.7s cubic-bezier(0.34,1.56,0.64,1) 0.2s both;
  }
  .app-item {
    display:flex; flex-direction:column; align-items:center; gap:6px;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .app-icon {
    width:60px; height:60px; border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
    border: 1px solid rgba(255,255,255,0.35);
    box-shadow: 0 3px 10px rgba(0,40,80,0.18), inset 0 1px 0 rgba(255,255,255,0.45);
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1),
                box-shadow 0.35s ease;
    will-change:transform;
  }
  .app-icon::after {
    content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.65) 0%,
      rgba(255,255,255,0.25) 22%,
      rgba(255,255,255,0.05) 44%,
      transparent 50%,
      rgba(0,0,0,0.06) 100%);
  }
  .app-icon i { font-size:24px; color:#fff; position:relative; z-index:2;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.2)); }
  .app-item:hover .app-icon {
    transform: scale(1.12) translateY(-3px);
    box-shadow: 0 8px 24px rgba(0,40,80,0.22), 0 0 18px var(--icon-glow, var(--glow-cyan)),
                inset 0 1px 0 rgba(255,255,255,0.45);
  }
  .app-item:active .app-icon {
    transform: scale(0.95);
    transition-duration: 0.12s;
  }
  .app-name {
    font-size:11px; font-weight:700; color:var(--text-primary);
    text-shadow: 0 1px 3px rgba(255,255,255,0.6);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:72px; text-align:center;
  }
  .app-item.hidden { display:none; }

  /* === DOCK === */
  .dock-wrap {
    margin-bottom:auto; margin-top:auto; padding-bottom: env(safe-area-inset-bottom, 12px);
    animation: fadeSlideUp 0.7s cubic-bezier(0.34,1.56,0.64,1) 0.4s both;
  }
  .dock {
    background: var(--dock-bg);
    backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding:12px 16px;
    display:flex; justify-content:space-around; align-items:center;
    box-shadow: 0 -4px 24px rgba(0,60,120,0.1), 0 8px 32px var(--glass-shadow),
                inset 0 1px 0 rgba(255,255,255,0.4);
    position:relative; overflow:hidden;
  }
  .dock::before {
    content:''; position:absolute; top:0; left:0; right:0; height:50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, transparent 100%);
    pointer-events:none; border-radius: 22px 22px 0 0;
  }
  .dock-item {
    display:flex; flex-direction:column; align-items:center; gap:4px;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    padding:4px 8px; border-radius:12px;
    transition: background 0.25s ease;
  }
  .dock-item:hover { background: rgba(255,255,255,0.15); }
  .dock-icon {
    width:50px; height:50px; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
    border: 1px solid rgba(255,255,255,0.35);
    box-shadow: 0 2px 8px rgba(0,40,80,0.15), inset 0 1px 0 rgba(255,255,255,0.45);
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.35s ease;
  }
  .dock-icon::after {
    content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background: linear-gradient(180deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.2) 25%, transparent 50%);
  }
  .dock-icon i { font-size:20px; color:#fff; position:relative; z-index:2;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.2)); }
  .dock-item:hover .dock-icon {
    transform: scale(1.1) translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,40,80,0.2), 0 0 14px var(--icon-glow, var(--glow-cyan)),
                inset 0 1px 0 rgba(255,255,255,0.45);
  }
  .dock-item:active .dock-icon { transform:scale(0.93); transition-duration:0.1s; }
  .dock-name { font-size:10px; font-weight:700; color:var(--text-primary);
    text-shadow: 0 1px 2px rgba(255,255,255,0.5); }

  /* === APP PANEL === */
  .panel-overlay {
    position:fixed; inset:0; z-index:100;
    background: rgba(0,40,80,0.25);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity:0; pointer-events:none;
    transition: opacity 0.4s ease;
  }
  .panel-overlay.active { opacity:1; pointer-events:auto; }
  .panel {
    position:fixed; bottom:0; left:50%; transform:translateX(-50%) translateY(100%);
    width:100%; max-width:500px; max-height:80vh;
    z-index:101;
    background: linear-gradient(180deg, rgba(230,245,255,0.92) 0%, rgba(210,235,250,0.95) 100%);
    backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    border: 1px solid rgba(255,255,255,0.5);
    border-bottom:none;
    border-radius: 24px 24px 0 0;
    box-shadow: 0 -8px 40px rgba(0,60,120,0.15), 0 0 60px var(--glow-soft);
    overflow:hidden;
    transition: transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }
  .panel.active { transform:translateX(-50%) translateY(0); }
  .panel-handle {
    width:36px; height:4px; border-radius:2px;
    background: rgba(0,60,120,0.2); margin:10px auto 0;
  }
  .panel-header {
    display:flex; align-items:center; gap:12px;
    padding:14px 20px 10px;
    border-bottom:1px solid rgba(0,60,120,0.08);
  }
  .panel-header-icon {
    width:36px; height:36px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
    border: 1px solid rgba(255,255,255,0.35);
  }
  .panel-header-icon::after {
    content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background: linear-gradient(180deg, rgba(255,255,255,0.5) 0%, transparent 50%);
  }
  .panel-header-icon i { font-size:16px; color:#fff; position:relative; z-index:2; }
  .panel-title { font-size:18px; font-weight:800; color:var(--text-primary); flex:1; }
  .panel-close {
    width:30px; height:30px; border-radius:50%; border:none;
    background: rgba(0,60,120,0.08); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-secondary); font-size:14px;
    transition: background 0.2s, transform 0.2s;
  }
  .panel-close:hover { background: rgba(0,60,120,0.15); transform:scale(1.1); }
  .panel-content {
    padding:16px 20px 28px; overflow-y:auto; max-height: calc(80vh - 80px);
    scrollbar-width:thin; scrollbar-color: rgba(0,60,120,0.15) transparent;
  }
  .panel-content::-webkit-scrollbar { width:4px; }
  .panel-content::-webkit-scrollbar-thumb { background:rgba(0,60,120,0.15); border-radius:2px; }

  /* Panel inner styles */
  .task-input-wrap {
    display:flex; gap:8px; margin-bottom:16px; flex-wrap: wrap;
  }
  .task-input {
    flex:1; padding:10px 14px;
    background: rgba(255,255,255,0.6); border:1px solid rgba(0,60,120,0.12);
    border-radius:10px; font-family:inherit; font-size:14px; font-weight:500;
    color:var(--text-primary); outline:none;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .task-input:focus {
    border-color: rgba(100,210,255,0.5);
    box-shadow: 0 0 12px var(--glow-soft);
  }
  .task-add-btn {
    padding:10px 16px; border:none; border-radius:10px;
    background: linear-gradient(135deg, #4DB6AC, #00897B);
    color:#fff; font-family:inherit; font-size:14px; font-weight:700;
    cursor:pointer; white-space:nowrap;
    box-shadow: 0 2px 8px rgba(0,137,123,0.3);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .task-add-btn:hover { transform:scale(1.05); box-shadow: 0 4px 14px rgba(0,137,123,0.4); }
  .task-add-btn:active { transform:scale(0.96); }
  .task-list { display:flex; flex-direction:column; gap:8px; }
  .task-item {
    display:flex; align-items:center; gap:10px;
    padding:10px 14px; border-radius:10px;
    background: rgba(255,255,255,0.5);
    border: 1px solid rgba(0,60,120,0.06);
    transition: background 0.2s, transform 0.2s, opacity 0.3s;
    animation: taskIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes taskIn { from { opacity:0; transform:translateY(-8px) scale(0.95); } }
  .task-item.done { opacity:0.5; }
  .task-item.done .task-text { text-decoration:line-through; }
  .task-check {
    width:22px; height:22px; border-radius:50%; flex-shrink:0;
    border:2px solid rgba(0,137,123,0.4); background:transparent;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition: background 0.25s, border-color 0.25s, transform 0.2s;
  }
  .task-check:hover { transform:scale(1.15); }
  .task-item.done .task-check {
    background: linear-gradient(135deg, #4DB6AC, #00897B);
    border-color: #00897B;
  }
  .task-check i { font-size:11px; color:#fff; opacity:0; transition:opacity 0.2s; }
  .task-item.done .task-check i { opacity:1; }
  .task-text { flex:1; font-size:14px; font-weight:600; color:var(--text-primary); }
  .task-delete {
    width:24px; height:24px; border:none; border-radius:6px;
    background:transparent; cursor:pointer; color:var(--text-muted);
    font-size:12px; display:flex; align-items:center; justify-content:center;
    transition: background 0.2s, color 0.2s;
  }
  .task-delete:hover { background:rgba(239,83,80,0.12); color:#EF5350; }
  .empty-state {
    text-align:center; padding:24px; color:var(--text-muted);
    font-size:14px; font-weight:600;
  }
  .empty-state i { font-size:32px; margin-bottom:8px; display:block; opacity:0.5; }

  .note-area {
    width:100%; min-height:200px; padding:14px;
    background: rgba(255,255,255,0.5); border:1px solid rgba(0,60,120,0.1);
    border-radius:12px; font-family:inherit; font-size:14px; font-weight:500;
    color:var(--text-primary); outline:none; resize:vertical;
    transition: border-color 0.3s, box-shadow 0.3s;
    line-height:1.6;
  }
  .note-area:focus { border-color:rgba(100,210,255,0.5); box-shadow:0 0 12px var(--glow-soft); }

  .placeholder-panel {
    text-align:center; padding:40px 20px;
  }
  .placeholder-panel .ph-icon {
    width:64px; height:64px; border-radius:18px; margin:0 auto 16px;
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
    border:1px solid rgba(255,255,255,0.35);
    box-shadow:0 4px 14px rgba(0,40,80,0.15);
  }
  .placeholder-panel .ph-icon::after {
    content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background: linear-gradient(180deg, rgba(255,255,255,0.55) 0%, transparent 50%);
  }
  .placeholder-panel .ph-icon i { font-size:26px; color:#fff; position:relative; z-index:2; }
  .placeholder-panel h3 { font-size:18px; font-weight:800; color:var(--text-primary); margin-bottom:6px; }
  .placeholder-panel p { font-size:13px; color:var(--text-secondary); line-height:1.5; }

  /* === TOAST === */
  .toast {
    position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-80px);
    z-index:200; padding:10px 20px;
    background: rgba(230,245,255,0.95);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border:1px solid rgba(255,255,255,0.5);
    border-radius:14px;
    box-shadow: 0 4px 20px rgba(0,60,120,0.12), 0 0 20px var(--glow-soft);
    font-size:13px; font-weight:700; color:var(--text-primary);
    transition: transform 0.5s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s;
    opacity:0; pointer-events:none; white-space:nowrap;
  }
  .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

  /* === KEYFRAMES === */
  @keyframes fadeSlideDown {
    from { opacity:0; transform:translateY(-20px) scale(0.96); }
    to { opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes fadeSlideUp {
    from { opacity:0; transform:translateY(20px); }
    to { opacity:1; transform:translateY(0); }
  }

  /* === REDUCED MOTION === */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration:0.01ms !important;
      transition-duration:0.01ms !important;
    }
    .bubble { display:none; }
  }

  /* === RESPONSIVE === */
  @media (max-width:380px) {
    .clock-time { font-size:44px; }
    .app-icon { width:52px; height:52px; border-radius:14px; }
    .app-icon i { font-size:20px; }
    .app-grid { gap:12px 8px; }
  }
</style>
</head>
<body>

<!-- Background scene -->
<div class="sun" aria-hidden="true"></div>
<div class="cloud cloud-1" aria-hidden="true"></div>
<div class="cloud cloud-2" aria-hidden="true"></div>
<div class="cloud cloud-3" aria-hidden="true"></div>
<div class="cloud cloud-4" aria-hidden="true"></div>
<div class="cloud cloud-5" aria-hidden="true"></div>
<div id="bubbles" aria-hidden="true"></div>

<!-- Main launcher -->
<main class="launcher" role="main">
  <!-- Status bar -->
  <div class="status-bar" aria-label="Status bar">
    <span id="statusTime"></span>
    <div class="status-icons">
      <i class="fa-solid fa-wifi"></i>
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-battery-three-quarters"></i>
    </div>
  </div>

  <!-- Clock widget -->
  <section class="clock-widget" aria-label="Clock and weather">
    <div class="clock-glow"></div>
    <div class="greeting" id="greeting"></div>
    <div class="clock-time" id="clockTime"></div>
    <div class="clock-date" id="clockDate"></div>
    <div class="clock-weather">
      <i class="fa-solid fa-sun"></i>
      <span>24°C &middot; Sunny</span>
    </div>
  </section>

  <!-- Search -->
  <div class="search-wrap">
    <input type="text" class="search-bar" id="searchBar" placeholder="Search your Life OS..." aria-label="Search apps">
    <i class="fa-solid fa-magnifying-glass search-icon"></i>
  </div>

  <!-- App grid -->
  <div class="app-grid" id="appGrid" role="list" aria-label="Apps"></div>

  <!-- Dock -->
  <nav class="dock-wrap" aria-label="Quick access dock">
    <div class="dock" id="dock"></div>
  </nav>
</main>

<!-- Panel overlay -->
<div class="panel-overlay" id="panelOverlay" aria-hidden="true"></div>
<!-- App panel -->
<aside class="panel" id="appPanel" role="dialog" aria-label="App panel">
  <div class="panel-handle"></div>
  <div class="panel-header">
    <div class="panel-header-icon" id="panelIcon"><i></i></div>
    <div class="panel-title" id="panelTitle"></div>
    <button class="panel-close" id="panelClose" aria-label="Close panel"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="panel-content" id="panelContent"></div>
</aside>

<!-- Toast -->
<div class="toast" id="toast" role="alert" aria-live="polite"></div>

<script>
/* ========================================
   AUDIO ENGINE — Web Audio API sound FX
   ======================================== */
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function sfxHover() {
  ensureAudio();
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.connect(g); g.connect(audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(1400, t);
  osc.frequency.exponentialRampToValueAtTime(1800, t + 0.04);
  g.gain.setValueAtTime(0.018, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
  osc.start(t); osc.stop(t + 0.08);
}

function sfxClick() {
  ensureAudio();
  const t = audioCtx.currentTime;
  const osc1 = audioCtx.createOscillator();
  const g1 = audioCtx.createGain();
  osc1.connect(g1); g1.connect(audioCtx.destination);
  osc1.type = 'sine';
  osc1.frequency.setValueAtTime(660, t);
  g1.gain.setValueAtTime(0.07, t);
  g1.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  osc1.start(t); osc1.stop(t + 0.12);
  
  const osc2 = audioCtx.createOscillator();
  const g2 = audioCtx.createGain();
  osc2.connect(g2); g2.connect(audioCtx.destination);
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(1200, t);
  g2.gain.setValueAtTime(0.04, t);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
  osc2.start(t); osc2.stop(t + 0.06);
}

function sfxOpen() {
  ensureAudio();
  const t = audioCtx.currentTime;
  const len = 0.28;
  const bufSize = Math.floor(audioCtx.sampleRate * len);
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) {
    d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.04));
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 2800; bp.Q.value = 0.6;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.045, t);
  g.gain.linearRampToValueAtTime(0.06, t + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  src.connect(bp); bp.connect(g); g.connect(audioCtx.destination);
  src.start(t);
}

function sfxClose() {
  ensureAudio();
  const t = audioCtx.currentTime;
  const len = 0.22;
  const bufSize = Math.floor(audioCtx.sampleRate * len);
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) {
    d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.03));
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 1400; bp.Q.value = 0.5;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.035, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  src.connect(bp); bp.connect(g); g.connect(audioCtx.destination);
  src.start(t);
}

function sfxBubble() {
  ensureAudio();
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.connect(g); g.connect(audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(900, t);
  osc.frequency.exponentialRampToValueAtTime(300, t + 0.08);
  g.gain.setValueAtTime(0.02, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
  osc.start(t); osc.stop(t + 0.09);
}

function sfxComplete() {
  ensureAudio();
  const t = audioCtx.currentTime;
  [880, 1100, 1320].forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.connect(g); g.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.value = f;
    const start = t + i * 0.07;
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(0.05, start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, start + 0.2);
    osc.start(start); osc.stop(start + 0.2);
  });
}

/* ========================================
   APP DATA
   ======================================== */
const gridApps = [
  { id:'journal', name:'Journal', icon:'fa-diagram-project', grad:'linear-gradient(135deg,#FF8A65,#D84315)', glow:'rgba(255,110,64,0.45)', url:'./dd/dd.html' },
  { id:'tasks', name:'Tasks', icon:'fa-circle-check', grad:'linear-gradient(135deg,#81C784,#2E7D32)', glow:'rgba(76,175,80,0.45)', url:'./taskiee/taskiee.html' },
  { id:'exercise', name:'Exercise', icon:'fa-dumbbell', grad:'linear-gradient(135deg,#4DB6AC,#00695C)', glow:'rgba(0,150,136,0.45)', url:'./exercise/exercise.html' },
  { id:'goals', name:'Life_OS', icon:'fa-bullseye', grad:'linear-gradient(135deg,#FFD54F,#F57F17)', glow:'rgba(255,145,0,0.45)', url:'./life_os/index.html' },
  { id:'financia', name:'Financia', icon:'fa-wallet', grad:'linear-gradient(135deg,#AED581,#558B2F)', glow:'rgba(139,195,74,0.45)', url:'./finances/finance.html' },
  { id:'vault', name:'vault', icon:'fa-vault', grad:'linear-gradient(135deg,#EF5350,#C62828)', glow:'rgba(244,67,54,0.45)', url:'./vault/vault.html' },
  { id:'notes', name:'Notes', icon:'fa-note-sticky', grad:'linear-gradient(135deg,#64B5F6,#1565C0)', glow:'rgba(33,150,243,0.45)' },
  { id:'Aura', name:'Meditation', icon:'fa-om', grad:'linear-gradient(135deg,#64B5F6,#1565C0)', glow:'rgba(33,150,243,0.45)', url:'./meditation_zone.html' },
  { id:'rulebook', name:'Life Rulebook', icon:'fa-heart', grad:'linear-gradient(135deg,#4DB6AC,#00695C)', glow:'rgba(0,150,136,0.45)', url:'./life_manual.html' },
  { id:'calendar', name:'Calendar', icon:'fa-calendar-days', grad:'linear-gradient(135deg,#7986CB,#283593)', glow:'rgba(63,81,181,0.45)' },
];

const dockApps = [
  { id:'music', name:'Musezx', icon:'fa-music', url:'./MUSEZX.html', grad:'linear-gradient(135deg,#F48FB1,#AD1457)', glow:'rgba(233,30,99,0.45)' },
  { id:'gallery', name:'Gallery', icon:'fa-images', url:'./comingsoon.html', grad:'linear-gradient(135deg,#4DD0E1,#006064)', glow:'rgba(0,188,212,0.45)' },
  { id:'reader', name:'Reading', icon:'fa-book-open', url:'./reading/reader.html', grad:'linear-gradient(135deg,#FF7043,#BF360C)', glow:'rgba(255,87,34,0.45)' },
  { id:'settings', name:'Settings', icon:'fa-gear', url:'./comingsoon.html', grad:'linear-gradient(135deg,#90A4AE,#37474F)', glow:'rgba(96,125,139,0.45)' },
];

const allApps = [...gridApps, ...dockApps];

/* ========================================
   STATE DATA
   ======================================== */
let notesContent = 'Key priorities this week:\n\n1. Launch the new dashboard design\n2. Complete exercise tracking setup\n3. Schedule team sync for Friday\n4. Update financial projections\n\nRemember: small consistent steps lead to big results.';
let calendarEvents = [];

/* ========================================
   RENDER APPS
   ======================================== */
function renderGrid() {
  const grid = document.getElementById('appGrid');
  grid.innerHTML = '';
  gridApps.forEach((app, i) => {
    const el = document.createElement('div');
    el.className = 'app-item';
    el.setAttribute('role','listitem');
    el.setAttribute('data-name', app.name.toLowerCase());
    el.style.animationDelay = `${0.25 + i * 0.05}s`;
    el.innerHTML = `
      <div class="app-icon" style="background:${app.grad}; --icon-glow:${app.glow}">
        <i class="fa-solid ${app.icon}"></i>
      </div>
      <span class="app-name">${app.name}</span>
    `;
    el.addEventListener('mouseenter', sfxHover);
    el.addEventListener('click', () => { 
      sfxClick(); 
      if(app.url) {
        window.location.href = app.url;
      } else {
        openApp(app); 
      }
    });
    grid.appendChild(el);
  });
}

function renderDock() {
  const dock = document.getElementById('dock');
  dock.innerHTML = '';
  dockApps.forEach(app => {
    const el = document.createElement('div');
    el.className = 'dock-item';
    el.innerHTML = `
      <div class="dock-icon" style="background:${app.grad}; --icon-glow:${app.glow}">
        <i class="fa-solid ${app.icon}"></i>
      </div>
      <span class="dock-name">${app.name}</span>
    `;
    el.addEventListener('mouseenter', sfxHover);
    el.addEventListener('click', () => { sfxClick(); openApp(app); });
    dock.appendChild(el);
  });
}

/* ========================================
   PANEL SYSTEM
   ======================================== */
const panel = document.getElementById('appPanel');
const overlay = document.getElementById('panelOverlay');
const panelIcon = document.getElementById('panelIcon');
const panelTitle = document.getElementById('panelTitle');
const panelContent = document.getElementById('panelContent');
const panelClose = document.getElementById('panelClose');
let currentApp = null;

function openApp(app) {
  currentApp = app;
  panelIcon.style.background = app.grad;
  panelIcon.querySelector('i').className = 'fa-solid ' + app.icon;
  panelTitle.textContent = app.name;
  panelContent.innerHTML = getAppContent(app);
  bindPanelEvents(app);
  panel.classList.add('active');
  overlay.classList.add('active');
  overlay.setAttribute('aria-hidden','false');
  sfxOpen();
}

function closePanel() {
  panel.classList.remove('active');
  overlay.classList.remove('active');
  overlay.setAttribute('aria-hidden','true');
  sfxClose();
  currentApp = null;
}

panelClose.addEventListener('click', closePanel);
overlay.addEventListener('click', closePanel);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && currentApp) closePanel(); });

function getAppContent(app) {
  if (app.id === 'notes') return buildNotesHTML();
  if (app.id === 'calendar') return buildCalendarHTML();
  return buildPlaceholderHTML(app);
}

function buildNotesHTML() {
  return `<textarea class="note-area" id="noteArea" placeholder="Start typing your notes...">${notesContent}</textarea>`;
}

function buildCalendarHTML() {
  return `
    <div class="task-input-wrap">
      <input type="date" class="task-input" id="calDate" style="flex:1;">
      <input type="time" class="task-input" id="calTime" style="flex:1;">
      <input type="text" class="task-input" id="calEvent" placeholder="Event details..." style="min-width: 100%;">
      <button class="task-add-btn" id="calAddBtn" style="width: 100%; margin-top: 8px;">Add Event</button>
    </div>
    <div class="task-list" id="eventList"></div>
  `;
}

function buildPlaceholderHTML(app) {
  return `
    <div class="placeholder-panel">
      <div class="ph-icon" style="background:${app.grad}">
        <i class="fa-solid ${app.icon}"></i>
<a href="${app.url}">
      </div>
      <h3>${app.name}</h3>  </a>
      <p>This module is ready to be configured. Start tracking and organizing your life data here.</p>
    </div>
  `;
}

function bindPanelEvents(app) {
  if (app.id === 'notes') {
    setTimeout(() => {
      const area = document.getElementById('noteArea');
      area.addEventListener('input', () => { notesContent = area.value; });
    }, 50);
  }

  if (app.id === 'calendar') {
    setTimeout(() => {
      const dateIn = document.getElementById('calDate');
      const timeIn = document.getElementById('calTime');
      const eventIn = document.getElementById('calEvent');
      const btn = document.getElementById('calAddBtn');

      const today = new Date().toISOString().split('T')[0];
      dateIn.value = today;

      function refreshEvents() {
         const list = document.getElementById('eventList');
         if(calendarEvents.length === 0) {
           list.innerHTML = '<div class="empty-state"><i class="fa-solid fa-calendar-xmark"></i>No events scheduled.</div>';
           return;
         }
         calendarEvents.sort((a,b) => new Date(a.date+'T'+a.time) - new Date(b.date+'T'+b.time));

         list.innerHTML = calendarEvents.map((ev, i) => `
           <div class="task-item" data-idx="${i}">
             <div style="flex:1;">
               <div class="task-text">${ev.title}</div>
               <div style="font-size:12px; color:var(--text-muted); font-weight: 600;">${ev.date} at ${ev.time}</div>
             </div>
             <button class="task-delete cal-delete" aria-label="Delete event"><i class="fa-solid fa-trash-can"></i></button>
           </div>
         `).join('');
      }

      btn.addEventListener('click', () => {
        if(!eventIn.value || !dateIn.value || !timeIn.value) {
          showToast('Please fill all fields');
          return;
        }
        calendarEvents.push({
          date: dateIn.value,
          time: timeIn.value,
          title: eventIn.value
        });
        eventIn.value = '';
        sfxClick();
        refreshEvents();
        showToast('Event added');
      });

      document.getElementById('eventList').addEventListener('click', e => {
        const item = e.target.closest('.task-item');
        if(!item) return;
        if(e.target.closest('.cal-delete')) {
          const idx = parseInt(item.dataset.idx);
          item.style.transform = 'translateX(60px) scale(0.9)';
          item.style.opacity = '0';
          setTimeout(() => {
            calendarEvents.splice(idx, 1);
            sfxClick();
            refreshEvents();
            showToast('Event removed');
          }, 250);
        }
      });

      refreshEvents();
    }, 50);
  }
}

/* ========================================
   TOAST
   ======================================== */
let toastTimer = null;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

/* ========================================
   SEARCH
   ======================================== */
document.getElementById('searchBar').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  document.querySelectorAll('.app-item').forEach(item => {
    const name = item.dataset.name;
    item.classList.toggle('hidden', q !== '' && !name.includes(q));
  });
});

/* ========================================
   CLOCK
   ======================================== */
function updateClock() {
  const now = new Date();
  const h = now.getHours();
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  const h12 = h % 12 || 12;
  const ampm = h >= 12 ? 'PM' : 'AM';

  document.getElementById('clockTime').innerHTML = `${h12}:${m}<span class="seconds">${s} ${ampm}</span>`;
  document.getElementById('statusTime').textContent = `${h12}:${m} ${ampm}`;

  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('clockDate').textContent = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;

  let greeting = 'Good Evening';
  if (h < 12) greeting = 'Good Morning';
  else if (h < 17) greeting = 'Good Afternoon';
  document.getElementById('greeting').textContent = greeting;
}

/* ========================================
   BUBBLES
   ======================================== */
function spawnBubble() {
  const container = document.getElementById('bubbles');
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  const size = 8 + Math.random() * 28;
  const left = Math.random() * 100;
  const dur = 10 + Math.random() * 14;
  bubble.style.cssText = `
    width:${size}px; height:${size}px;
    left:${left}%; bottom:-${size}px;
    animation-duration:${dur}s;
  `;
  container.appendChild(bubble);
  bubble.addEventListener('animationend', () => {
    bubble.remove();
    sfxBubble();
  });
}

/* ========================================
   INIT
   ======================================== */
function init() {
  renderGrid();
  renderDock();
  updateClock();
  setInterval(updateClock, 1000);

  // Spawn bubbles periodically
  setInterval(spawnBubble, 1800);
  // Initial batch
  for (let i = 0; i < 6; i++) setTimeout(spawnBubble, i * 400);

  // Init audio on first interaction
  document.addEventListener('click', ensureAudio, { once: true });
  document.addEventListener('touchstart', ensureAudio, { once: true });
}

init();
</script>
</body>
